<style>
  :root{
    --ink:#1A2733; --ink-soft:#4D6072;
    --paper:#B8D4EC; --panel:#F4F9FE;
    --accent:#3A8FD1; --accent-dark:#1E5F9E; --accent-soft:#D6EAFA;
    --teal:#4C9E7A; --teal-soft:#DFF2E9;
    --line:#A9C7E0; --danger:#C7433A; --danger-soft:#FBE0DD; --success:#4C9E5C; --success-soft:#E1F2E4;
    --info:#2E7BC4; --info-soft:#DCEBFA;
    --input-bg:#FFFFFF; --kpi-bg:#EAF3FC; --preview-bg:#8FB8D9;
    --badge-entrega-bg:#E6DEF7; --badge-entrega-fg:#6B47A8; --badge-areceber-bg:#FCEACB; --badge-areceber-fg:#A66A11;
    --radius:6px; --shadow:0 1px 3px rgba(20,60,100,.25); --blur:none; --font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:var(--font-family); font-size:16px; -webkit-font-smoothing:antialiased; padding-bottom:88px;}
  .num{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; font-variant-numeric:tabular-nums;}
  .app{max-width:720px;margin:0 auto;padding:16px;}
  .app.tab-enter{animation:tabFadeIn .22s cubic-bezier(.22,.9,.32,1);}
  .sticky-head{position:sticky; top:0; z-index:15; background:var(--paper); padding-top:10px; margin-top:-10px;}
  @keyframes tabFadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .app.tab-enter{animation:none;} }

  header.top{display:flex; align-items:center; justify-content:space-between; padding:10px 16px 6px; max-width:720px; margin:0 auto; gap:10px;}
  header.top .brand{display:flex; align-items:center; gap:8px; min-width:0;}
  header.top .brand img{width:30px; height:30px; border-radius:7px; object-fit:cover; border:1px solid var(--line); flex-shrink:0;}
  header.top .brand .txt{display:flex; align-items:baseline; flex-wrap:wrap; gap:5px; min-width:0;}
  header.top .brand b{font-size:16px; letter-spacing:-0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .brand span{font-size:11.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .lockbtn{background:none;border:none;font-size:18px;color:var(--ink-soft);min-height:auto;padding:6px;}

  .roller{height:4px; border-radius:4px; margin:0 16px 10px; background:repeating-linear-gradient(90deg, var(--accent) 0 22px, transparent 22px 30px); max-width:688px;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:var(--shadow); backdrop-filter:var(--blur,none);}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; justify-content:space-between;}
  h2{font-size:17px; margin:0 0 12px; letter-spacing:-0.01em;}
  h3{font-size:14px; margin:0; letter-spacing:-0.01em;}

  label{display:block; font-size:12.5px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
  input[type=text], input[type=number], input[type=tel], input[type=password], input[type=date], input[type=email], select, textarea{
    width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line); border-radius:8px; background:var(--input-bg); color:var(--ink); font-family:var(--font-family);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  select{-webkit-appearance:none; appearance:none; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B8B3A6' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 10px center; background-size:16px; padding-right:32px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .field{margin-bottom:10px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1; min-width:0;}

  button{font-family:inherit; font-size:15px; font-weight:600; border-radius:8px; border:1px solid transparent; padding:12px 16px; cursor:pointer; min-height:46px; white-space:normal; word-break:break-word; line-height:1.25;}
  a.btn-ghost, a.btn-primary, a.btn-secondary, a.btn-danger, a.btn-success, a.btn-info{display:flex; align-items:center; justify-content:center; text-align:center; font-family:inherit; font-size:15px; font-weight:600; border-radius:8px; border:1px solid transparent; padding:12px 16px; cursor:pointer; min-height:46px; text-decoration:none; white-space:normal; word-break:break-word; line-height:1.25; box-sizing:border-box;}
  .btn-primary{background:var(--accent); color:#fff;}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-secondary{background:var(--teal-soft); color:var(--teal);}
  .btn-ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  .btn-danger{background:var(--danger-soft); color:var(--danger);}
  .btn-success{background:var(--success-soft); color:var(--success);}
  .btn-info{background:var(--info-soft); color:var(--info);}
  .btn-sm{padding:8px 12px; min-height:36px; font-size:13.5px;}
  .btn-block{width:100%;}
  .btn-lg{min-height:64px; font-size:15.5px;}
  button:disabled{opacity:.4; cursor:not-allowed;}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .bigbtn{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; line-height:1.2;}
  .bigbtn .ic{font-size:24px;}

  .kpi{border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--kpi-bg); cursor:pointer; text-align:left;}
  .kpi .kv{font-size:20px; font-weight:800;}
  .kpi .kl{font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-top:2px;}
  .kpi.active-filter{border-color:var(--accent); background:var(--accent-soft);}

  .item-row-v2{display:flex; align-items:flex-start; gap:8px; padding:10px 0; border-bottom:1px solid var(--line);}
  .item-row-v2:last-child{border-bottom:none;}
  .item-row-v2 .item-info{flex:1; min-width:0; cursor:pointer;}
  .item-row-v2 .item-name{font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.3;}
  .item-row-v2 .item-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .item-row-v2 .item-cost{opacity:.7;}
  .item-row-v2 .item-controls{display:flex; align-items:center; gap:5px; flex-shrink:0; padding-top:1px;}
  .qtybtn{width:26px; height:26px; min-width:26px; border-radius:50%; border:1px solid var(--line); background:var(--input-bg); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; color:var(--accent); cursor:pointer; padding:0;}
  .qtynum{min-width:20px; text-align:center; font-weight:600; font-size:14px;}
  .prod-table-head{display:grid; grid-template-columns:1fr 56px 56px 62px; gap:5px; padding:6px 0; border-bottom:1px solid var(--line); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); font-weight:700;}
  .prod-table-row{display:grid; grid-template-columns:1fr 56px 56px 62px; gap:5px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .prod-table-row:active{background:var(--kpi-bg);}
  .prod-table-row .num{font-size:11.5px;}
  .prod-table-row .pname{font-weight:700; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;}
  .prod-table-row .pforn{font-size:10px; opacity:.55; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .prod-table-row .pnamewrap{min-width:0; overflow:hidden;}
  @media (min-width:600px){
    .prod-table-head{grid-template-columns:1fr 74px 74px 84px;}
    .prod-table-row{grid-template-columns:1fr 74px 74px 84px;}
    .prod-table-row .num{font-size:12.5px;}
    .prod-table-row .pname{font-size:13.5px;}
  }
  .margin-card .totals .line span:first-child{color:var(--ink-soft);}
  .margin-card .line.grand{color:var(--success);}
  .margin-card.negative .line.grand{color:var(--danger);}
  .iconbtn{background:none;border:none;color:var(--danger);font-size:18px;padding:0;min-height:auto;cursor:pointer;}

  .subtotal-row{display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px dashed var(--line); font-weight:700; font-size:14.5px;}
  .section-block{border:1px dashed var(--line); border-radius:8px; padding:12px; margin-bottom:12px; background:var(--kpi-bg); backdrop-filter:var(--blur,none);}
  .section-block .sec-head{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .section-block .sec-head input[type=text]{font-weight:700; font-size:15px;}

  .totals .line{display:flex; justify-content:space-between; padding:6px 0; font-size:14.5px;}
  .totals .line.grand{font-size:19px; font-weight:800; border-top:2px solid var(--ink); margin-top:6px; padding-top:12px;}
  .fee-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line);}
  .fee-row:last-child{border-bottom:none;}
  .fee-row label.chk{display:flex; align-items:center; gap:8px; font-weight:600; color:var(--ink); font-size:14px; flex:1; margin:0;}
  .fee-row input[type=checkbox]{width:18px;height:18px;}
  .fee-inputs{display:flex; gap:6px; width:170px;}
  .fee-inputs select{width:82px; padding:8px 26px 8px 8px; font-size:13px; background-position:right 6px center; background-size:13px;}
  .fee-inputs input{padding:8px; font-size:14px;}

  .searchbox{position:relative;}
  .suggest{position:absolute; top:100%; left:0; right:0; background:var(--kpi-bg); backdrop-filter:var(--blur,none); border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; z-index:20; box-shadow:0 6px 18px rgba(0,0,0,.35);}
  .suggest div{padding:10px 12px; font-size:14px; border-bottom:1px solid var(--line); cursor:pointer;}
  .suggest div:last-child{border-bottom:none;}
  .suggest div:active{background:var(--accent-soft);}
  .suggest .empty{color:var(--ink-soft); font-style:italic;}

  .list-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); gap:10px; cursor:pointer;}
  .list-row:last-child{border-bottom:none;}
  .list-row .info b{display:block; font-size:14.5px;}
  .list-row .info span{font-size:12.5px; color:var(--ink-soft);}
  .list-row .actions{display:flex; gap:6px; flex-shrink:0;}

  .badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em;}
  .badge.orcamento{background:var(--info-soft); color:var(--info);}
  .badge.pedido{background:var(--accent-soft); color:var(--accent-dark);}
  .badge.entrega{background:var(--badge-entrega-bg); color:var(--badge-entrega-fg);}
  .badge.entregando{background:var(--teal-soft); color:var(--teal);}
  .badge.a_receber{background:var(--badge-areceber-bg); color:var(--badge-areceber-fg);}
  .badge.finalizado{background:var(--success-soft); color:var(--success);}
  .badge.cancelado{background:var(--danger-soft); color:var(--danger);}

  .empty-state{text-align:center; padding:26px 10px; color:var(--ink-soft); font-size:14px;}

  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); display:flex; padding:5px 2px calc(5px + env(safe-area-inset-bottom)); z-index:30;}
  nav.tabs button{flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); font-size:10.5px; font-weight:700; padding:7px 1px; border-radius:8px; min-height:auto;}
  nav.tabs button.active{color:var(--accent-dark); background:var(--accent-soft);}
  nav.tabs .ic{font-size:18px;}

  .modal-bg{position:fixed; inset:0; background:rgba(10,9,7,.55); backdrop-filter:blur(4px); display:flex; align-items:flex-end; z-index:100; animation:modalFadeIn .18s ease;}
  .modal-bg.center{align-items:center; padding:16px;}
  .modal-bg.fullscreen{align-items:stretch; padding:0;}
  .modal{background:var(--panel); backdrop-filter:var(--blur,none); border-radius:14px 14px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); width:100%; max-height:88vh; overflow-y:auto; animation:modalPopIn .22s cubic-bezier(.22,.9,.32,1);}
  .modal.fsmodal{width:100%; height:100%; max-height:100%; border-radius:0; display:flex; flex-direction:column; padding:12px 10px calc(10px + env(safe-area-inset-bottom));}
  .modal-bg.center .modal{border-radius:14px; max-width:420px;}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin:-18px -16px 12px -16px; padding:14px 16px 12px 16px; position:sticky; top:0; z-index:5; background:var(--panel); backdrop-filter:var(--blur,none); border-bottom:1px solid var(--line);}
  .fsmodal .modal-head{margin:-12px -10px 10px -10px; padding:10px 10px 8px 10px;}
  .modal-head button{background:none;border:none;font-size:22px;color:var(--ink-soft);min-height:auto;padding:0;}
  @keyframes modalFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalPopIn{ from{opacity:0; transform:translateY(18px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  @media (prefers-reduced-motion: reduce){ .modal-bg, .modal{animation:none;} }

  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:200; opacity:0; transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center;}
  .toast.show{opacity:1;}
  .hidden{display:none !important;}
  .muted{color:var(--ink-soft); font-size:13px;}
  .subtabs{display:flex; gap:8px; margin-bottom:14px;}
  .subtabs button{flex:1;}
  .imgpreview{width:100%; max-width:220px; border-radius:8px; border:1px solid var(--line); display:block; margin:8px 0;}
  .tagchip{display:inline-flex; align-items:center; gap:6px; background:var(--teal-soft); color:var(--teal); padding:6px 10px; border-radius:20px; font-size:13px; font-weight:600; margin:0 6px 6px 0;}
  .tagchip button{background:none;border:none;color:var(--teal);font-size:14px;padding:0;min-height:auto;cursor:pointer;}
  .taglist{display:flex; flex-wrap:wrap; margin-bottom:8px;}

  #backupGate{position:fixed; inset:0; background:var(--paper); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;}
  #lockScreen{position:fixed; inset:0; background:var(--paper); z-index:500; display:flex; align-items:flex-start; justify-content:center; padding:20px; padding-top:12vh;}
  #lockScreen .box, #backupGate .box{width:100%; max-width:340px; text-align:center;}
  #lockScreen .ic, #backupGate .ic{font-size:38px; margin-bottom:10px;}

  #pdfArea{display:none;}
  .pdf-doc{background:#fff; color:#222; padding:12px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:10px; line-height:1.25;}
  .pdf-doc .pdf-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:1px;}
  .pdf-doc .pdf-head-left{display:flex; align-items:center; gap:7px;}
  .pdf-doc .pdf-head img{width:32px; height:32px; object-fit:cover; border-radius:5px; flex-shrink:0;}
  .pdf-doc h1{font-size:13px; margin:0; font-family:inherit;}
  .pdf-doc .pdf-email{font-size:8.5px; color:#666; text-align:right; white-space:nowrap;}
  .pdf-doc .pdf-addr{font-size:8.5px; color:#666; margin:1px 0 6px;}
  .pdf-doc .pdf-sub{font-size:8.5px; color:#666; margin-bottom:6px;}
  .pdf-doc table{width:100%; border-collapse:collapse; margin-bottom:2px;}
  .pdf-doc th, .pdf-doc td{padding:2px 2px; font-size:8.5px; border-bottom:1px solid #ddd; text-align:left;}
  .pdf-doc th{text-transform:uppercase; font-size:7.5px; letter-spacing:.03em; color:#666;}
  .pdf-doc td.r, .pdf-doc th.r{text-align:right; padding-left:6px;}
  .pdf-doc .sectitle{font-weight:bold; font-size:9px; margin:5px 0 1px;}
  .pdf-doc .subtot{text-align:right; font-weight:bold; font-size:8.5px; padding:1px 0 4px;}
  .pdf-doc .tot-block{margin-top:5px; border-top:2px solid #222; padding-top:3px;}
  .pdf-doc .tot-line{display:flex; justify-content:space-between; font-size:9px; padding:1px 0;}
  .pdf-doc .tot-line.grand{font-size:12.5px; font-weight:bold; padding-top:3px;}
  .pdf-doc .cliente{margin-bottom:5px; font-size:9px; line-height:1.3;}
  .pdf-doc .pixbox{margin-top:6px; padding-top:5px; border-top:1px dashed #999; font-size:8.5px; display:flex; align-items:center; gap:8px;}
  .pdf-doc .pixbox img{width:44px;height:44px;object-fit:contain;}
  .pdf-doc .marcas{margin-top:5px; font-size:7.5px; color:#777;}
  .pdf-doc .pdf-client-box{background:#EEF1F2; border-radius:8px; padding:7px 9px; margin:7px 0 8px;}
  .pdf-doc .production-alert{background:#B22828; color:#fff; border-radius:7px 7px 0 0; padding:7px 9px; margin:-12px -12px 8px;}
  .pdf-doc .production-alert-title{font-weight:800; font-size:12px; letter-spacing:.02em;}
  .pdf-doc .production-alert-sub{font-size:7.8px; margin-top:2px;}
  .pdf-doc .production-title-bar{background:#0F6179;}
  .pdf-doc .production-info-box{margin-top:7px;}
  .pdf-doc .production-info-title{font-weight:800; font-size:9.5px; margin-bottom:3px;}
  .pdf-doc .production-items-title{font-weight:800; font-size:9.5px; margin:9px 0 2px; border-bottom:2px solid #DCE5E8; padding-bottom:3px;}
  .pdf-doc .production-section-title{margin-top:6px;}
  .pdf-doc .production-total-highlight{margin-top:8px;}
  .pdf-doc .production-total-highlight .tot-line.grand{color:#8a1f1f;}
  .pdf-doc .pdf-title-bar{background:#0F6179; color:#fff; border-radius:7px; text-align:center; padding:5px 8px; font-weight:800; font-size:12px; margin-bottom:8px;}
  .pdf-doc .pdf-section-title{background:#DCE5E8; border-radius:7px 7px 0 0; padding:4px 7px; font-weight:800; font-size:9.5px; color:#222; margin-top:7px;}
  .pdf-doc .pdf-pay-box{border-top:1px solid #ccc; margin-top:8px; padding-top:6px; font-size:8.5px;}
  .pdf-doc .pdf-total-highlight{background:#E5F2E6; border:1px solid #9FC6A3; border-radius:8px; padding:6px 9px; margin-top:5px;}
  .pdf-doc .pdf-footer{margin-top:18px; text-align:center; font-size:7.5px; color:#777; border-top:1px solid #ddd; padding-top:5px;}
  #previewScroll{max-height:56vh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; -webkit-overflow-scrolling:touch;}
  .fsmodal #previewScroll{flex:1; max-height:none; margin-bottom:0;}
  @media (max-width:480px){
    .pdf-doc{padding:9px; font-size:9px;}
    .pdf-doc h1{font-size:12px;}
    .pdf-doc .pdf-head img{width:28px; height:28px;}
    .pdf-doc table th, .pdf-doc table td{padding:2px 1.5px; font-size:7.8px;}
    .pdf-doc .tot-line.grand{font-size:11.5px;}
    .pdf-doc .sectitle{font-size:8.5px; margin:4px 0 1px;}
  }
  .fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:0 12px;}
  @media (min-width:700px){ .fgrid .span2{grid-column:span 2;} }
  @media (min-width:900px){
    body{padding-bottom:0; padding-left:210px;}
    header.top{max-width:none; padding:14px 28px 6px;}
    .roller{max-width:none; margin:0 28px 12px;}
    .app{max-width:1480px; padding:8px 28px 28px;}

<script>
/* Firebase: inicialização explícita antes do restante do aplicativo.
   Não usamos <script type="module"> aqui porque módulos são deferidos e o
   script principal poderia executar antes de window.fbOnAuth existir. */
function _withTimeoutRaw(promise,ms,label){
  let timer;
  const timeout = new Promise((_,reject)=>{ timer=setTimeout(()=>reject(new Error(label+' demorou mais de '+Math.round(ms/1000)+'s (provável bloqueio de rede/firewall).')),ms); });
  return Promise.race([promise,timeout]).finally(()=>clearTimeout(timer));
}
window.fbReady = (async function(){
  try {
    const [{ initializeApp }, authMod, fsMod] = await _withTimeoutRaw(Promise.all([
      import("https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js")
    ]), 12000, "Carregamento dos módulos do Firebase (gstatic.com)");
    const firebaseConfig=(window.APP_CONFIG&&window.APP_CONFIG.firebase)||{};
    if(!firebaseConfig.apiKey || String(firebaseConfig.apiKey).indexOf('COLE_AQUI')>=0) throw new Error('Firebase ainda não configurado: preencha o arquivo config.js');
    const app=initializeApp(firebaseConfig);
    window.fbAuth=authMod.getAuth(app);
    window.fbDb=fsMod.getFirestore(app);
    window.fbSignIn=authMod.signInWithEmailAndPassword;
    window.fbOnAuth=authMod.onAuthStateChanged;
    window.fbDoc=fsMod.doc; window.fbGetDoc=fsMod.getDoc; window.fbSetDoc=fsMod.setDoc;
    window.fbCollection=fsMod.collection; window.fbGetDocs=fsMod.getDocs; window.fbWriteBatch=fsMod.writeBatch; window.fbRunTransaction=fsMod.runTransaction;
    window._firebaseInitError=null;
    return true;
  } catch(e) {
    console.error("Falha ao inicializar Firebase:", e);
    window._firebaseInitError=e;
    window._firebaseReady=false;
    return false;
  }
})();
</script>
<script>
/* ---------------- carregar bibliotecas externas dinamicamente (necessário no Apps Script) ---------------- */
function loadScript(url){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error('Falha ao carregar ' + url));
    document.head.appendChild(s);
  });
}
const librariesReady = Promise.all([
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')
]).catch(e=>{ console.error(e); });

/* ---------------- conexão com o banco de dados (Firebase) ---------------- */
async function withTimeout(promise,ms,label){let timer;const timeout=new Promise((_,reject)=>timer=setTimeout(()=>reject(new Error(label+' demorou mais de '+Math.round(ms/1000)+' segundos.')),ms));try{return await Promise.race([promise,timeout]);}finally{clearTimeout(timer);}}
/* ---------------- configuração da empresa (vem do config.js) ---------------- */
const APP = Object.assign({ empresaNome:'Orçamentos', tagline:'Orçamentos e Pedidos', storagePrefix:'orcamentos' }, window.APP_CONFIG||{});
const LOGIN_EMAIL_KEY = APP.storagePrefix+'_login_email';
const ULTIMO_VENDEDOR_KEY = APP.storagePrefix+'_ultimo_vendedor';

/* Coleções: um documento por registro (produto, cliente, pedido). Só o que mudou é gravado,
   então duas pessoas usando ao mesmo tempo não apagam o trabalho uma da outra. */
const COLLECTION_KEYS=['clients','products','pedidos'];
const _lastSaved={clients:{},products:{},pedidos:{}};
async function cloudGet(key){
  const scalar={config:['app','config'],logo:['app','logo'],qrcode:['app','qrcode'],templates:['app','templates']};
  if(COLLECTION_KEYS.includes(key)) {
    const snap=await withTimeout(window.fbGetDocs(window.fbCollection(window.fbDb,key)),15000,"Leitura de "+key);
    const items=snap.docs.map(d=>d.data());
    _lastSaved[key]={};
    items.forEach(it=>{ if(it && it.id!=null) _lastSaved[key][String(it.id)]=JSON.stringify(it); });
    return items;
  }
  const path=scalar[key];
  if(!path) return null;
  const snap=await withTimeout(window.fbGetDoc(window.fbDoc(window.fbDb,path[0],path[1])),10000,"Leitura de "+key);
  if(!snap.exists()) return null;
  const d=snap.data();
  return (key==='logo'||key==='qrcode') ? (d.dataUrl||d.value||null) : (d.value ?? d);
}
async function cloudSet(key,value){
  if(COLLECTION_KEYS.includes(key)){
    const items=JSON.parse(value||'[]');
    const last=_lastSaved[key]||{}; const cur={}; const ops=[];
    items.forEach(item=>{
      if(!item || item.id==null) return;
      const id=String(item.id); const json=JSON.stringify(item); cur[id]=json;
      if(last[id]!==json) ops.push({type:'set',id,item});
    });
    Object.keys(last).forEach(id=>{ if(!(id in cur)) ops.push({type:'del',id}); });
    for(let i=0;i<ops.length;i+=400){
      const batch=window.fbWriteBatch(window.fbDb);
      ops.slice(i,i+400).forEach(op=>{
        const ref=window.fbDoc(window.fbDb,key,op.id);
        if(op.type==='set') batch.set(ref,op.item); else batch.delete(ref);
      });
      await withTimeout(batch.commit(),20000,"Gravação de "+key);
    }
    _lastSaved[key]=cur;
    return true;
  }
  const scalar={config:['app','config'],logo:['app','logo'],qrcode:['app','qrcode'],templates:['app','templates']};
  const path=scalar[key]; if(!path) throw new Error('Chave Firebase não configurada: '+key);
  const payload=(key==='logo'||key==='qrcode')?{dataUrl:value}:{value:value};
  await window.fbSetDoc(window.fbDoc(window.fbDb,path[0],path[1]),payload,{merge:false}); return true;
}

let _pendingSaves=0; const _failedKeys=new Set();
async function persist(key, value){
  _pendingSaves++;
  try{ const ok = await _persistInner(key, value); if(ok) _failedKeys.delete(key); else _failedKeys.add(key); return ok; }
  finally{ _pendingSaves--; }
}
async function _persistInner(key, value){
  for(let attempt=0; attempt<3; attempt++){
    try{ await cloudSet(key, value); return true; }
    catch(e){ if(attempt===2) return false; await new Promise(res=>setTimeout(res, 350*(attempt+1))); }
  }
  return false;
}
let _lastRefresh=Date.now();
/* Recarrega clientes, produtos e pedidos do banco (para ver o que outra pessoa lançou). */
async function refreshData(silent){
  if(!window._firebaseReady) return;
  if(_pendingSaves>0){ if(!silent) toast('Aguarde: salvando alterações...'); return; }
  if(_failedKeys.size>0){ if(!silent) toast('Há alterações que não foram salvas — tente salvar de novo antes de atualizar'); return; }
  if(!silent) toast('Atualizando dados...');
  try{
    const [cl,pr,pe,tp]=await Promise.all([cloudGet('clients'),cloudGet('products'),cloudGet('pedidos'),cloudGet('templates')]);
    if(_pendingSaves>0) return;
    if(cl) state.clients=cl; if(pr) state.products=pr; if(pe) state.pedidos=pe;
    if(tp) state.templates=typeof tp==='string'?JSON.parse(tp):tp;
    if(state.tab!=='ajustes'){
      const c=await cloudGet('config');
      if(c) state.config=Object.assign(state.config,typeof c==='string'?JSON.parse(c):c);
      if(!Array.isArray(state.config.vendedores)) state.config.vendedores=[];
    }
    _lastRefresh=Date.now();
    const ae=document.activeElement; const digitando=!!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName));
    const modalAberto=document.getElementById('modalRoot').innerHTML.trim()!=='';
    if(!(silent && (digitando||modalAberto||state.tab==='orcamento'))) render();
    if(!silent) toast('Dados atualizados');
  }catch(e){ if(!silent) toast('Não consegui atualizar agora — verifique a internet'); }
}

function formatMoneyDisplay(cents){
  let s = String(Math.max(0, Math.round(cents)));
  while(s.length<3) s = '0'+s;
  let intPart = s.slice(0,-2).replace(/^0+(?=\d)/,'');
  if(!intPart) intPart='0';
  const centPart = s.slice(-2);
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return intPart+','+centPart;
}
function moneyInputToNumber(displayStr){

    try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){}
  });
}

function resizeImageFile(file, maxDim){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>=h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
        try{ resolve(canvas.toDataURL('image/png')); }catch(e){ reject(e); }
      };
      img.onerror = ()=>reject(new Error('imagem inválida'));
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  localStorage.setItem(LOGIN_EMAIL_KEY,email);

    await withTimeout(window.fbSignIn(window.fbAuth,email,pass), 12000, "Login (signInWithEmailAndPassword)");

}

/* Cada PARTE de pedido aparece no setor em que está; "A receber" é por pedido (saldo). Ordem: o mais urgente primeiro. */
function setoresInicio(){
  const res = { producao:[], entrega:[], entregando:[], receber:[] };
  state.pedidos.forEach(p=>{
    if(['orcamento','cancelado','finalizado'].includes(p.status)) return;
    normalizarAlloc(p);
    const partes = getPartes(p); const multi = partes.length>1;
    const numeroBase = p.numero ? 'Nº '+p.numero : 'Pedido';
    partes.forEach(pt=>{
      const key = { pedido:'producao', entrega:'entrega', entregando:'entregando' }[pt.status];
      if(!key) return;
      const pz = prazoInfo(p, pt);
      res[key].push({ id:p.id, numeroLabel: numeroBase+(multi?'-'+pt.id:''), cliente:p.clientName||'Sem nome',
        valor: multi ? valorParte(p, pt.id) : p.total, itens: itensDaParteLista(p, pt.id).reduce((t,x)=>t+x.q,0),
        prazo:pz, ordem:pz.diffDias });
    });
    if(partes.some(pt=>pt.status==='a_receber') && saldoPedido(p)>0.005){
      const datas = partes.filter(pt=>pt.status==='a_receber').map(pt=>pt.entregueEm||p.convertidoEmPedidoEm||p.createdAt).sort();
      const dias = Math.max(0, Math.floor((Date.now()-new Date(datas[0]).getTime())/86400000));
      const cor = dias>=15 ? 'var(--danger)' : (dias>=7 ? '#C9862B' : 'var(--ink-soft)');
      res.receber.push({ id:p.id, numeroLabel:numeroBase, cliente:p.clientName||'Sem nome', valor:saldoPedido(p), itens:totalItensPedido(p),
        dias, prazo:{ diffDias:-dias, cor, texto: dias===0 ? 'entregue hoje' : 'entregue há '+dias+' dia'+(dias>1?'s':'') }, ordem:-dias });
    }
  });
  Object.keys(res).forEach(k=> res[k].sort((a,b)=> a.ordem-b.ordem || b.valor-a.valor));
  return res;
}

/* ---------------- gráfico de resumo e indicador de conversão (SVG puro) ---------------- */
function buildResumoChartSVG(pedidosDoMes){
  const hoje = new Date();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  const porDia = new Array(diasNoMes+1).fill(0);
  pedidosDoMes.forEach(p=>{ const d = new Date(p.createdAt).getDate(); if(d>=1 && d<=diasNoMes) porDia[d]+=p.total; });
  let acumulado = 0; const serie = [];
  for(let d=1; d<=diasNoMes; d++){ acumulado += porDia[d]; serie.push(acumulado); }
  const max = Math.max(...serie, 1);
  const W = 300, H = 110, padL = 4, padR = 4, padT = 10, padB = 18;
  const stepX = (W-padL-padR)/(diasNoMes-1||1);
  const pts = serie.map((v,i)=>{
    const x = padL + i*stepX;
    const y = padT + (H-padT-padB) * (1 - v/max);
    return [x,y];
  });
  const linePath = pts.map((p,i)=>`${i===0?'M':'L'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const areaPath = linePath + ` L ${pts[pts.length-1][0].toFixed(1)} ${H-padB} L ${pts[0][0].toFixed(1)} ${H-padB} Z`;
  const last = pts[pts.length-1];
  const labelX = [1, Math.round(diasNoMes/2), diasNoMes];
  const labels = labelX.map(d=>{
    const x = padL + (d-1)*stepX;
    return `<text x="${x.toFixed(1)}" y="${H-4}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${String(d).padStart(2,'0')}</text>`;
  }).join('');
  return `
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block; overflow:visible;">
    <defs>
      <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#chartFill)"/>
    <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="var(--accent)"/>
    ${labels}
  </svg>`;
}
function buildConversionRingSVG(percent){
  const size=110, stroke=10, r=(size-stroke)/2, c=2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c * (1 - pct/100);
  return `
  <svg viewBox="0 0 ${size} ${size}" width="110" height="110">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--ink)">${Math.round(pct)}%</text>
  </svg>`;
}

function resumoMes(offsetMonths){
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-offsetMonths);
  const ano = d.getFullYear(), mes = d.getMonth();
  const doMes = state.pedidos.filter(p=>{ const pd=new Date(p.createdAt); return pd.getFullYear()===ano && pd.getMonth()===mes && p.status!=='cancelado' && p.status!=='orcamento'; });
  const gasto = doMes.reduce((s,p)=>s+custoLiquido(p),0);
  const ganho = doMes.reduce((s,p)=>s+margemLiquida(p),0);
  const vendido = doMes.reduce((s,p)=>s+totalLiquido(p),0);
  return { label: `${MES_NOMES[mes]}/${ano}`, gasto, ganho, vendido };
}

/* ================= ORÇAMENTO ================= */
function parcelPercentFor(b){
  const cfg = state.config;
  const inst = cfg.installments[b.installIdx];
  const raw = inst ? parseNum(inst.percent) : 0;
  return { raw };
}
function sectionPct(sec, rawPct){ return (sec.parcelOn===false) ? 0 : rawPct; }
function calcSectionSubtotal(sec, pct){ pct = pct||0; return sec.items.reduce((s,it)=>s+(parseNum(it.qty)*parseNum(it.price)*(1+pct/100)),0); }
function calcSectionCusto(sec){ return sec.items.reduce((s,it)=>s+(parseNum(it.qty)*parseNum(it.cost||0)),0); }
function calcTotals(b){
  const cfg = state.config;
  const { raw:parcelPercentRaw } = parcelPercentFor(b);
  const subtotalBase = b.sections.reduce((s,sec)=>s+calcSectionSubtotal(sec,0),0);
  const custoTotal = b.sections.reduce((s,sec)=>s+calcSectionCusto(sec),0);
  const subtotal = b.sections.reduce((s,sec)=>s+calcSectionSubtotal(sec, sectionPct(sec, parcelPercentRaw)),0);
  const parcelaAdd = subtotal - subtotalBase;
  const baseAntesDesconto = subtotal;
  let desconto = 0;
  const disc = b.discount || {on:false,type:'%',value:''};
  if(disc.on){
    const val = parseNum(disc.value);
    if(disc.type==='%') desconto = baseAntesDesconto * val/100;
    else if(disc.type==='fixo') desconto = val;
    else if(disc.type==='final') desconto = baseAntesDesconto - val;
  }
  if(desconto<0) desconto = 0;
  if(desconto>baseAntesDesconto) desconto = baseAntesDesconto;
  const base = baseAntesDesconto - desconto;
  let card=0, nota=0;
  if(b.cardFee.on){ card = b.cardFee.type==='%' ? base*parseNum(b.cardFee.value)/100 : parseNum(b.cardFee.value); }
  if(b.notaFee.on){ nota = b.notaFee.type==='%' ? base*parseNum(b.notaFee.value)/100 : parseNum(b.notaFee.value); }
  const total = base+card+nota;
  const margem = subtotalBase - custoTotal - desconto;
  const margemPercent = subtotalBase>0 ? (margem/subtotalBase*100) : 0;
  return { subtotal, subtotalBase, parcelaAdd, desconto, card, nota, total, custoTotal, margem, margemPercent, parcelPercentRaw };
}

function wireTabEvents(){
  if(state.tab==='inicio'){ wireInicio(); return; }
  if(state.tab==='pendencias'){ wirePendencias(); return; }
  if(state.tab==='relatorio'){ wireRelatorio(); return; }
  if(state.tab==='pedidos'){ wirePedidos(); return; }
  if(state.tab==='financeiro'){ wireFinanceiro(); return; }
  if(state.tab!=='orcamento'){ wireOtherTabs(); return; }
  const app = document.getElementById('app');
  const b = state.budget;

  app.querySelectorAll('[data-priceidx]').forEach(btn=> btn.addEventListener('click', ()=>{ b.priceIdx=Number(btn.dataset.priceidx); render(); }));
  const um = app.querySelector('[data-act=usarmodelo]'); if(um) um.addEventListener('click', ()=> templatesModal());
  const sm = app.querySelector('[data-act=salvarmodelo]'); if(sm) sm.addEventListener('click', ()=> salvarComoModelo());
  const selInstall = app.querySelector('[data-act=selinstall]');
  if(selInstall) selInstall.addEventListener('change', e=>{ b.installIdx = Number(e.target.value); renderTotalsOnly(); });
  const selclient = app.querySelector('[data-act=selclient]');
  if(selclient) selclient.addEventListener('change', e=>{ b.clientId = e.target.value||null; render(); });
  const abrirCliBtn = app.querySelector('[data-act=abrircliente]');
  if(abrirCliBtn) abrirCliBtn.addEventListener('click', ()=>{ openClientPicker(cid=>{ b.clientId = cid; render(); }); });
  const trocarBtn = app.querySelector('[data-act=trocarcliente]'); if(trocarBtn) trocarBtn.addEventListener('click', ()=>{ b.clientId=null; render(); });
  const avulsoBtn = app.querySelector('[data-act=clienteavulso]'); if(avulsoBtn) avulsoBtn.addEventListener('click', ()=>{ b.clientId='avulso'; render(); });
  const avNome = app.querySelector('[data-act=avulsoNome]'); if(avNome) avNome.addEventListener('input', e=> b.clientAvulsoNome=e.target.value);
  const avTel = app.querySelector('[data-act=avulsoTel]'); if(avTel) avTel.addEventListener('input', e=> b.clientAvulsoTel=e.target.value);

function renderTotalsOnly(){

    b.sections[si].items.forEach((it,ii)=>{

async function gerarNumeroPedido(){
  // O número vem de um contador único no banco (transação), assim duas pessoas nunca recebem o mesmo número.
  const maiorExistente = state.pedidos.reduce((m,p)=>{
    const digits = String(p.numero||'').replace(/\D/g,'');
    const n = digits ? parseInt(digits,10) : 0;
    return n>m ? n : m;
  }, 0);
  try{
    const ref = window.fbDoc(window.fbDb,'app','counter');
    const n = await withTimeout(window.fbRunTransaction(window.fbDb, async tx=>{
      const snap = await tx.get(ref);
      const atual = snap.exists() ? (Number(snap.data().seq)||0) : 0;
      const prox = Math.max(atual, maiorExistente) + 1;
      tx.set(ref, { seq: prox });
      return prox;
    }), 15000, 'Geração do número do pedido');
    return String(n);
  }catch(e){
    toast('Não consegui gerar o número do pedido — verifique a internet e tente de novo');
    return null;
  }
}
async function buildPedidoFromBudget(existingId){
  const b = state.budget; const t = calcTotals(b);
  let clienteNome="", clienteTel="";
  if(b.clientId==='avulso'){ clienteNome=b.clientAvulsoNome; clienteTel=b.clientAvulsoTel; }
  else if(b.clientId){ const c = state.clients.find(c=>c.id===b.clientId); if(c){ clienteNome=c.name; clienteTel=c.phone; } }
  const existing = existingId ? state.pedidos.find(p=>p.id===existingId) : null;
  let numero = existing && existing.numero;
  if(!numero){ numero = await gerarNumeroPedido(); if(!numero) return null; }
  const vend = (state.config.vendedores||[]).find(v=>v.id===b.vendedorId);
  // Object.assign com o pedido existente preserva qualquer campo que a tela de orçamento não conhece
  const novo = Object.assign({}, existing||{}, {
    id: existingId || uid(),
    numero,
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    status: existing ? existing.status : 'orcamento',
    pago: existing ? !!existing.pago : false,
    clientId: b.clientId==='avulso'?null:b.clientId, clientName:clienteNome, clientPhone:clienteTel,
    vendedorId: b.vendedorId||null,
    vendedorNome: vend ? vend.nome : ((existing && existing.vendedorNome) || ''),
    entregaObs: String(b.entregaObs||'').trim(),
    priceIdx:b.priceIdx, installIdx:b.installIdx,
    sections: JSON.parse(JSON.stringify(b.sections)),
    cardFee: JSON.parse(JSON.stringify(b.cardFee)), notaFee: JSON.parse(JSON.stringify(b.notaFee)),
    discount: JSON.parse(JSON.stringify(b.discount||{on:false,type:'%',value:''})),
    subtotal:t.subtotal, total:t.total, custoTotal:t.custoTotal, margem:t.margem, margemPercent:t.margemPercent,
    parcelPercentRaw:t.parcelPercentRaw, parcelaAddValor: t.parcelaAdd,
    prazoDias: existing&&existing.prazoDias ? existing.prazoDias : 5,
    valorFornecedor: existing?existing.valorFornecedor:0,
    fornecedorPago: existing?!!existing.fornecedorPago:false
  });
  if(Array.isArray(novo.partes)){ normalizarAlloc(novo); recalcStatusPedido(novo); }
  recalcPagamento(novo);
  return novo;
}

async function salvarOrcamento(){
  const b = state.budget;
  let clienteNome = b.clientId==='avulso' ? b.clientAvulsoNome : (state.clients.find(c=>c.id===b.clientId)||{}).name;
  if(!clienteNome){ toast('Selecione ou digite um cliente antes de salvar'); return; }
  const hasItems = b.sections.some(s=>s.items.length>0);
  if(!hasItems){ toast('Adicione ao menos um item ao orçamento'); return; }
  if(!validarVendedor(b)) return;
  const pedido = await buildPedidoFromBudget(b.editingId); if(!pedido) return;
  if(b.editingId){ const idx = state.pedidos.findIndex(p=>p.id===b.editingId); if(idx>-1) state.pedidos[idx]=pedido; else state.pedidos.push(pedido); }
  else { state.pedidos.push(pedido); b.editingId = pedido.id; }
  const ok = await savePedidos(); if(ok) toast('Orçamento salvo'); render();
}
async function converterOrcamentoEmPedido(){
  const b = state.budget;
  let clienteNome = b.clientId==='avulso' ? b.clientAvulsoNome : (state.clients.find(c=>c.id===b.clientId)||{}).name;
  if(!clienteNome){ toast('Selecione ou digite um cliente antes de converter'); return; }
  const hasItems = b.sections.some(s=>s.items.length>0);
  if(!hasItems){ toast('Adicione ao menos um item ao orçamento'); return; }
  if(!validarVendedor(b)) return;
  prazoModal(5, async (dias)=>{
    const pedido = await buildPedidoFromBudget(b.editingId); if(!pedido) return;
    if(pedido.status==='orcamento'){
      pedido.status = 'pedido';
      pedido.convertidoEmPedidoEm = new Date().toISOString();
      pedido.prazoDias = dias;
      criarPartesIniciais(pedido);
    }
    if(b.editingId){ const idx = state.pedidos.findIndex(p=>p.id===b.editingId); if(idx>-1) state.pedidos[idx]=pedido; else state.pedidos.push(pedido); }
    else state.pedidos.push(pedido);
    const ok = await savePedidos();
    if(ok) toast('Convertido em pedido!');
    state.budget = newBudget();
    state.tab='pedidos'; state.pedidoAberto = pedido.id;
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='pedidos'));
    render();
    perguntarPagamento(pedido);
  });
}

/* ================= PENDÊNCIAS ================= */
function diasUteisEntre(dataInicio, diasUteis){
  const d = new Date(dataInicio);
  let count = 0;
  while(count < diasUteis){
    d.setDate(d.getDate()+1);
    const dow = d.getDay();
    if(dow!==0 && dow!==6) count++;
  }
  return d;
}
function prazoInfo(p, pt){
  const prazoDias = (pt && pt.prazoDias) || p.prazoDias || 5;
  const dataBase = (pt && pt.convertidoEmPedidoEm) || p.convertidoEmPedidoEm || p.createdAt;
  const limite = diasUteisEntre(dataBase, prazoDias);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const lim = new Date(limite); lim.setHours(0,0,0,0);
  const diffDias = Math.round((lim-hoje)/(1000*60*60*24));
  let cor = 'var(--success)', texto = `Faltam ${diffDias} dias`;
  if(diffDias < 0){ cor = 'var(--danger)'; texto = `Atrasado há ${Math.abs(diffDias)} dia${Math.abs(diffDias)!==1?'s':''}`; }
  else if(diffDias === 0){ cor = 'var(--danger)'; texto = 'Vence hoje'; }
  else if(diffDias === 1){ cor = '#C9862B'; texto = 'Falta 1 dia'; }
  else if(diffDias <= 2){ cor = '#C9862B'; texto = `Faltam ${diffDias} dias`; }
  return { diffDias, cor, texto };
}
function pendenciasList(){
  const itens = [];
  state.pedidos.forEach(p=>{
    if(p.status==='cancelado' || p.status==='orcamento' || p.status==='finalizado') return;
    const partes = getPartes(p); const multi = partes.length>1;
    const numeroBase = p.numero ? 'Nº '+p.numero : 'Pedido';
    partes.forEach(pt=>{
      if(['pedido','entrega','entregando'].includes(pt.status)){
        const pz = prazoInfo(p, pt);
        itens.push({ pedido:p, parte:pt, tipo:'producao', ordem: pz.diffDias, prazo:pz, valor: multi ? valorParte(p, pt.id) : p.total,
          numeroLabel: numeroBase+(multi?'-'+pt.id:''), label: PART_LABEL[pt.status] });
      }
    });
    if(partes.some(pt=>pt.status==='a_receber') && saldoPedido(p)>0.005){
      itens.push({ pedido:p, tipo:'receber', ordem: 1000, prazo:null, valor: saldoPedido(p), numeroLabel:numeroBase, label:'A receber (saldo)' });
    }
    if(parseNum(p.valorFornecedor)>0 && !p.fornecedorPago){
      itens.push({ pedido:p, tipo:'pagar', ordem: 2000, prazo:null, valor: parseNum(p.valorFornecedor), numeroLabel:numeroBase, label:'Pagar fornecedor' });
    }
  });
  itens.sort((a,b)=>a.ordem-b.ordem);
  return itens;
}

    state.tab='pedidos'; state.pedidoAberto = btn.dataset.openPend; render();
  }));
}

/* ================= PEDIDOS ================= */
const STATUS_LABEL = { orcamento:'Orçamento', pedido:'Pedido', entrega:'Aguard. entrega', entregando:'Entregando', a_receber:'A receber', finalizado:'Finalizado', cancelado:'Cancelado' };

/* ---------------- fases habilitáveis do fluxo ---------------- */
const PHASE_ORDER = ['orcamento','pedido','entrega','entregando','a_receber','finalizado'];
function fasesAtivas(){ return Object.assign({ entrega:true, entregando:true, a_receber:true }, state.config.fasesAtivas||{}); }
function isPhaseActive(phase){
  if(phase==='orcamento'||phase==='pedido'||phase==='finalizado'||phase==='cancelado') return true;
  return !!fasesAtivas()[phase];
}
function nextStatus(status){
  const idx = PHASE_ORDER.indexOf(status);
  if(idx===-1 || idx>=PHASE_ORDER.length-1) return status;
  for(let j=idx+1;j<PHASE_ORDER.length;j++){ if(isPhaseActive(PHASE_ORDER[j])) return PHASE_ORDER[j]; }
  return PHASE_ORDER[PHASE_ORDER.length-1];
}
function prevStatus(status){
  const idx = PHASE_ORDER.indexOf(status);
  if(idx<=0) return null;
  for(let j=idx-1;j>=0;j--){ if(isPhaseActive(PHASE_ORDER[j])) return PHASE_ORDER[j]; }
  return null;
}
function getFlow(){
  const map = {};
  PHASE_ORDER.forEach(s=>{ if(s!=='finalizado') map[s] = nextStatus(s); });
  return map;
}
function getFlowBack(){
  const map = {};
  PHASE_ORDER.forEach(s=>{ const p = prevStatus(s); if(p) map[s]=p; });
  return map;
}
function getAdvanceLabel(status){
  const next = nextStatus(status);
  if(status==='orcamento') return 'Transformar em Pedido';
  if(next==='entrega') return 'Enviar para Entrega';
  if(next==='a_receber') return 'Marcar como Entregue (a receber)';
  if(next==='finalizado') return 'Finalizar pedido';
  return 'Avançar etapa';
}

/* ================= PARTES DO PEDIDO, PAGAMENTOS E DEVOLUÇÕES ================= */
const PART_ORDER = ['pedido','entrega','entregando','a_receber'];
const PART_LABEL = { pedido:'Em produção', entrega:'Aguardando entrega', entregando:'Entregando', a_receber:'Entregue' };
function isPartPhaseActive(st){ return (st==='pedido'||st==='a_receber') ? true : isPhaseActive(st); }
function partNext(st){ const i=PART_ORDER.indexOf(st); for(let j=i+1;j<PART_ORDER.length;j++){ if(isPartPhaseActive(PART_ORDER[j])) return PART_ORDER[j]; } return null; }
function partPrev(st){ const i=PART_ORDER.indexOf(st); for(let j=i-1;j>=0;j--){ if(isPartPhaseActive(PART_ORDER[j])) return PART_ORDER[j]; } return null; }
function labelAvancarParte(st){
  const nx = partNext(st);
  if(nx==='entrega') return 'Enviar para entrega';
  if(nx==='entregando') return '🚚 Saiu para entrega';
  if(nx==='a_receber') return '✅ Marcar como entregue';
  return 'Avançar';
}
function dataBR(iso){ const m=String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : ''; }

/* Partes: cada parte tem seu próprio status e prazo. Pedidos antigos (sem partes) viram uma parte única "A". */
function getPartes(p){
  if(Array.isArray(p.partes) && p.partes.length) return p.partes;
  if(p.status==='orcamento' || p.status==='cancelado') return [];
  const st = (p.status==='finalizado') ? 'a_receber' : p.status;
  p.partes = [{ id:'A', status: PART_ORDER.includes(st)?st:'pedido', convertidoEmPedidoEm: p.convertidoEmPedidoEm||p.createdAt, prazoDias: p.prazoDias||5 }];
  return p.partes;
}
function garantirIdsItens(p){
  const usados = new Set();
  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{ if(!it.id || usados.has(it.id)) it.id = uid(); usados.add(it.id); }));
}
function qtyNaParte(it, parteId){ return it.alloc ? parseNum(it.alloc[parteId]) : 0; }
/* Garante que a soma das quantidades por parte bate com a quantidade do item; remove partes vazias. */
function normalizarAlloc(p){
  const partes = getPartes(p); if(!partes.length) return;
  garantirIdsItens(p);
  const ids = partes.map(x=>x.id);
  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{
    const qty = parseNum(it.qty);
    const a = {};
    ids.forEach(id=>{ const v = it.alloc ? parseNum(it.alloc[id]) : 0; if(v>0) a[id]=v; });
    const soma = Object.values(a).reduce((t,v)=>t+v,0);
    if(soma < qty-1e-9){ a[ids[0]] = (a[ids[0]]||0) + (qty-soma); }
    else if(soma > qty+1e-9){
      let ex = soma-qty;
      for(const id of ids.slice().reverse()){
        if(ex<=1e-9) break;
        const t = Math.min(a[id]||0, ex);
        if(t>0){ a[id]-=t; ex-=t; if(a[id]<=1e-9) delete a[id]; }
      }
    }
    it.alloc = a;
  }));
  if(partes.length>1){
    const comItens = partes.filter(pt=> (p.sections||[]).some(sec=>sec.items.some(it=>qtyNaParte(it,pt.id)>0)));
    if(comItens.length && comItens.length<partes.length) p.partes = comItens;
  }
}
function itensDaParteLista(p, parteId){
  const out = [];
  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{ const q = qtyNaParte(it, parteId); if(q>0) out.push({sec, it, q}); }));
  return out;
}
function valorParte(p, parteId){
  const pctRaw = p.parcelPercentRaw||0; let sub = 0;
  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{ sub += qtyNaParte(it,parteId)*parseNum(it.price)*(1+sectionPct(sec,pctRaw)/100); }));
  return p.subtotal>0 ? (p.total||0)*sub/p.subtotal : 0;
}
function pedidoDaParte(p, parteId){
  if(!parteId) return p;
  normalizarAlloc(p);
  const pt = getPartes(p).find(x=>x.id===parteId);
  const secs = (p.sections||[]).map(sec=>({ title:sec.title, items: sec.items.map(it=>{ const q=qtyNaParte(it,parteId); return q>0 ? Object.assign({}, it, {qty:q}) : null; }).filter(Boolean) })).filter(sec=>sec.items.length);
  return Object.assign({}, p, { sections:secs, numero:(p.numero||'')+'-'+parteId, prazoDias:(pt&&pt.prazoDias)||p.prazoDias });
}
function proximaLetra(p){
  const usados = getPartes(p).map(x=>x.id); let c = 65;
  while(usados.includes(String.fromCharCode(c))) c++;
  return String.fromCharCode(c);
}
/* O status do pedido é o da parte menos avançada (finaliza sozinho só se a etapa "A receber" estiver desligada). */
function recalcStatusPedido(p){
  if(['orcamento','cancelado','finalizado'].includes(p.status)) return;
  const partes = getPartes(p); if(!partes.length) return;
  if(partes.every(pt=>pt.status==='a_receber') && !isPhaseActive('a_receber')){ p.status='finalizado'; return; }
  let min = Infinity;
  partes.forEach(pt=>{ const i = PHASE_ORDER.indexOf(pt.status); if(i>=0 && i<min) min=i; });
  if(min!==Infinity) p.status = PHASE_ORDER[min];
}
function criarPartesIniciais(p){
  if(!Array.isArray(p.partes) || !p.partes.length){
    p.partes = [{ id:'A', status:'pedido', convertidoEmPedidoEm: p.convertidoEmPedidoEm||new Date().toISOString(), prazoDias: p.prazoDias||5 }];
  }
  if(!Array.isArray(p.pagamentos)) p.pagamentos = [];
  if(!Array.isArray(p.devolucoes)) p.devolucoes = [];
  normalizarAlloc(p); recalcStatusPedido(p); recalcPagamento(p);
}

/* Valores: total líquido = total - devoluções; saldo = líquido - recebido (negativo = cliente tem a receber de volta). */
function totalDevolvido(p){ return (p.devolucoes||[]).reduce((t,d)=>t+parseNum(d.valor),0); }
function custoDevolvido(p){ return (p.devolucoes||[]).reduce((t,d)=>t+parseNum(d.custo),0); }
function totalLiquido(p){ return (p.total||0) - totalDevolvido(p); }
function custoLiquido(p){ return (p.custoTotal||0) - custoDevolvido(p); }
function margemLiquida(p){ return (p.margem||0) - (totalDevolvido(p) - custoDevolvido(p)); }
function recebidoLiquido(p){
  if(!Array.isArray(p.pagamentos)) return p.pago ? totalLiquido(p) : 0; // pedidos antigos, só com "pago/pendente"
  return p.pagamentos.reduce((t,x)=>t+(x.tipo==='reembolso'?-1:1)*parseNum(x.valor),0);
}
function saldoPedido(p){ return totalLiquido(p) - recebidoLiquido(p); }
function recalcPagamento(p){
  if(Array.isArray(p.pagamentos)) p.pago = (p.status!=='orcamento') && saldoPedido(p) <= 0.005;
}
function garantirPagamentos(p){
  if(Array.isArray(p.pagamentos)) return;
  p.pagamentos = [];
  if(p.pago) p.pagamentos.push({ id:uid(), tipo:'recebimento', valor: totalLiquido(p), forma:'Não informado', data: todayStr(), obs:'Pagamento anterior (migrado)' });
}
function qtdDevolvida(p, itemId){ return (p.devolucoes||[]).filter(d=>d.itemId===itemId).reduce((t,d)=>t+parseNum(d.qty),0); }
function fatorTotalPedido(p){ return p.subtotal>0 ? (p.total/p.subtotal) : 1; }

function devolucaoModal(p){

  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{
    const disp = parseNum(it.qty) - qtdDevolvida(p, it.id);

    <div class="modal-head"><h3>Devolução de material</h3><button id="mclose">✕</button></div>
    <div class="field"><label>Item devolvido</label><select id="dvItem">${itens.map((x,i)=>`<option value="${i}">${escapeHtml(x.it.name)} (pode devolver até ${x.disp})</option>`).join('')}</select></div>

  };
}
function unitEfetivoItem(p, sec, it){ return parseNum(it.price)*(1+sectionPct(sec, p.parcelPercentRaw||0)/100); }

function moverItensModal(p, origemId){
  normalizarAlloc(p);
  const partes = getPartes(p);
  const root = document.getElementById('modalRoot');
  let origId = (partes.find(x=>x.id===origemId)||partes[0]).id;
  const draw = ()=>{
    const orig = partes.find(x=>x.id===origId);
    const itens = itensDaParteLista(p, origId);
    const outras = partes.filter(x=>x.id!==origId);
    const defStatus = partNext(orig.status) || orig.status;
    root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
      <div class="modal-head"><h3>Separar itens do pedido</h3><button id="mclose">✕</button></div>
      ${partes.length>1?`<div class="field"><label>Tirar itens da parte</label><select id="mvOrigem">${partes.map(x=>`<option value="${x.id}" ${x.id===origId?'selected':''}>Parte ${x.id} — ${PART_LABEL[x.status]}</option>`).join('')}</select></div>`:''}
      <p class="muted" style="margin-top:0;">Informe quanto de cada item sai desta parte. Ex: os materiais de pronta entrega vão para "Aguardando entrega" enquanto o resto continua em produção.</p>
      ${itens.map(({sec,it,q})=>`<div class="list-row" style="cursor:default;"><div class="info"><b>${escapeHtml(it.name)}</b><span>${escapeHtml(sec.title)} · nesta parte: ${q}</span></div>
        <div style="display:flex; gap:6px; align-items:center;"><input type="number" min="0" max="${q}" step="any" value="0" data-mvitem="${it.id}" data-max="${q}" style="width:84px; text-align:center;"><button type="button" class="btn-ghost btn-sm" data-mvall="${it.id}" data-max="${q}">tudo</button></div></div>`).join('')}
      <div class="field" style="margin-top:12px;"><label>Enviar para</label><select id="mvDestino">${outras.map(x=>`<option value="${x.id}">Parte ${x.id} (${PART_LABEL[x.status]})</option>`).join('')}<option value="__nova" ${outras.length?'':'selected'}>Nova parte</option></select></div>
      <div id="mvNovaBox">
        <div class="row">
          <div class="field"><label>Situação da nova parte</label><select id="mvStatus">${PART_ORDER.filter(isPartPhaseActive).map(st=>`<option value="${st}" ${st===defStatus?'selected':''}>${PART_LABEL[st]}</option>`).join('')}</select></div>
          <div class="field"><label>Prazo (dias úteis)</label><input type="number" min="1" id="mvPrazo" value="2"></div>
        </div>
      </div>
      <div class="row" style="margin-top:12px;"><button class="btn-ghost btn-block" id="mvCancel">Cancelar</button><button class="btn-primary btn-block" id="mvOk">Separar</button></div>
    </div></div>`;
    const $ = id => document.getElementById(id);
    $('mclose').onclick = closeModal; $('mvCancel').onclick = closeModal;
    $('mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') closeModal(); });
    const org = $('mvOrigem'); if(org) org.addEventListener('change', ()=>{ origId = org.value; draw(); });
    root.querySelectorAll('[data-mvall]').forEach(b=> b.addEventListener('click', ()=>{ const inp = root.querySelector('[data-mvitem="'+b.dataset.mvall+'"]'); inp.value = b.dataset.max; }));
    const atualizaNova = ()=>{ $('mvNovaBox').classList.toggle('hidden', $('mvDestino').value!=='__nova'); };
    $('mvDestino').addEventListener('change', atualizaNova); atualizaNova();
    $('mvOk').onclick = async ()=>{
      const moves = [];
      root.querySelectorAll('[data-mvitem]').forEach(inp=>{ const q = parseNum(inp.value); const max = parseNum(inp.dataset.max); if(q>0) moves.push({id:inp.dataset.mvitem, q:Math.min(q,max)}); });
      if(!moves.length){ toast('Informe a quantidade de pelo menos um item'); return; }
      const dest = $('mvDestino').value;
      const totalOrigem = itens.reduce((t,x)=>t+x.q,0), totalMove = moves.reduce((t,m)=>t+m.q,0);
      if(dest==='__nova' && totalMove >= totalOrigem-1e-9){ toast('Você escolheu tudo desta parte — use o botão de avançar da própria parte'); return; }
      let destId = dest;
      if(dest==='__nova'){
        destId = proximaLetra(p);
        const nova = { id:destId, status:$('mvStatus').value, convertidoEmPedidoEm:new Date().toISOString(), prazoDias: parseInt($('mvPrazo').value,10)||2 };
        if(nova.status==='a_receber') nova.entregueEm = new Date().toISOString();
        partes.push(nova);
      }
      moves.forEach(m=>{
        (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{
          if(it.id!==m.id) return;
          it.alloc = it.alloc||{};
          it.alloc[origId] = (it.alloc[origId]||0) - m.q; if(it.alloc[origId]<=1e-9) delete it.alloc[origId];
          it.alloc[destId] = (it.alloc[destId]||0) + m.q;
        }));
      });
      normalizarAlloc(p); recalcStatusPedido(p); recalcPagamento(p);
      const ok = await savePedidos(); closeModal(); render();
      if(ok) toast(dest==='__nova' ? 'Parte '+destId+' criada' : 'Itens movidos para a parte '+destId);
    };
  };
  draw();
}

function filteredPedidos(){
  let list = state.pedidos.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(state.pedidoNumBusca){
    const q = state.pedidoNumBusca.replace(/\D/g,'');
    if(q) list = list.filter(p=> (p.numero||'').replace(/\D/g,'').includes(q));
  }
  if(state.pedidoClienteBusca){
    const q = normSearch(state.pedidoClienteBusca);
    if(q) list = list.filter(p=> normSearch(p.clientName||'').includes(q));
  }
  if(state.pedidoMesBusca){
    const [ano,mes] = state.pedidoMesBusca.split('-').map(Number);
    list = list.filter(p=>{ const d=new Date(p.createdAt); return d.getFullYear()===ano && (d.getMonth()+1)===mes; });
  }
  const f = state.pedidosFilter;
  if(!f) return list;
  if(f==='__mes_orc') return list.filter(p=>isThisMonth(p.createdAt));
  if(f==='__convertidos') return list.filter(p=>isThisMonth(p.createdAt) && p.status!=='orcamento' && p.status!=='cancelado');
  if(f==='__entregues') return list.filter(p=>p.status==='a_receber'||p.status==='finalizado');
  if(f==='__pendentes') return list.filter(p=>['pedido','entrega','entregando','a_receber'].includes(p.status));
  if(f==='__pagpendente') return list.filter(p=>p.status!=='orcamento' && p.status!=='cancelado' && saldoPedido(p)>0.005);
  return list.filter(p=>p.status===f);
}

function mesesDisponiveisPedidos(){
  const set = new Set();
  state.pedidos.forEach(p=>{ const d=new Date(p.createdAt); set.add(`${d.getFullYear()}-${d.getMonth()+1}`); });
  return Array.from(set).sort().reverse();
}

function calcDescontoPedido(p){
  let desconto = 0;
  const base = p.subtotal||0;
  if(p.discount && p.discount.on){
    const val = parseNum(p.discount.value);
    if(p.discount.type==='%') desconto = base*val/100;
    else if(p.discount.type==='fixo') desconto = val;
    else if(p.discount.type==='final') desconto = base-val;
    if(desconto<0) desconto=0; if(desconto>base) desconto=base;
  }
  return desconto;
}

function listaPedidosModal(title, pedidosList){
  const root = document.getElementById('modalRoot');
  const ordenada = pedidosList.slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  const total = ordenada.reduce((s,p)=>s+(p.total||0),0);
  const rows = ordenada.map(p=>`
    <div class="list-row" data-openp="${p.id}">
      <div class="info"><b>${p.numero?`Nº ${escapeHtml(p.numero)} — `:''}${escapeHtml(p.clientName||'Sem nome')}</b><span>${new Date(p.createdAt).toLocaleDateString('pt-BR')} · R$ ${money(p.total)}</span></div>
      <span class="badge ${p.status}">${STATUS_LABEL[p.status]||p.status}</span>
    </div>`).join('') || `<div class="empty-state">Nenhum pedido nesta lista.</div>`;
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" style="max-height:78vh;">
    <div class="modal-head"><h3>${escapeHtml(title)}</h3><button id="mclose">✕</button></div>
    ${ordenada.length>1?`<p class="muted" style="margin:-4px 0 10px;">${ordenada.length} pedidos · total R$ ${money(total)}</p>`:''}
    ${rows}
  </div></div>`;
  document.getElementById('mclose').onclick = closeModal;
  document.getElementById('mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') closeModal(); });
  root.querySelectorAll('[data-openp]').forEach(row=> row.addEventListener('click', ()=>{
    closeModal();
    state.tab='pedidos'; state.pedidoAberto = row.dataset.openp;
    document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='pedidos'));
    render();
  }));
}
function prazoModal(defaultDias, onConfirm){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg center" id="mbg"><div class="modal" style="max-width:340px; text-align:center;">
    <div style="font-size:30px; margin-bottom:8px;">⏱️</div>
    <h3 style="margin-bottom:6px;">Prazo de produção</h3>
    <p class="muted" style="margin-bottom:14px;">Quantos dias úteis para produzir este pedido?</p>
    <input type="number" min="1" id="prazoDiasInput" value="${defaultDias||5}" style="text-align:center; font-size:20px; font-weight:700; margin-bottom:14px;">
    <button class="btn-primary btn-block" id="prazoConfirm">Confirmar</button>
    <button class="btn-ghost btn-block" id="prazoCancel" style="margin-top:8px;">Cancelar</button>
  </div></div>`;
  document.getElementById('prazoCancel').onclick = closeModal;
  document.getElementById('mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') closeModal(); });
  const inp = document.getElementById('prazoDiasInput'); inp.focus(); inp.select();
  const confirmar = ()=>{
    const val = parseInt(inp.value,10) || (defaultDias||5);
    closeModal();
    onConfirm(val);
  };
  document.getElementById('prazoConfirm').onclick = confirmar;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmar(); });
}
function perguntarPagamento(p){
  const saldo = saldoPedido(p);
  if(saldo <= 0.005) return; // já está quitado
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg center" id="mbg"><div class="modal" style="max-width:340px; text-align:center;">
    <div style="font-size:30px; margin-bottom:8px;">💰</div>
    <h3 style="margin-bottom:6px;">Registrar pagamento?</h3>
    <p class="muted" style="margin-bottom:14px;">Pedido ${p.numero?`Nº ${escapeHtml(p.numero)}`:''} — saldo a receber: R$ ${money(saldo)}</p>
    <button class="btn-success btn-block" id="pagTotal">✅ Recebi o valor total</button>
    <button class="btn-info btn-block" id="pagParcial" style="margin-top:8px;">💵 Recebi uma entrada (parcial)</button>
    <button class="btn-ghost btn-block" id="pagNao" style="margin-top:8px;">⏳ Ainda não recebi</button>
  </div></div>`;
  document.getElementById('pagTotal').onclick = ()=> pagamentoModal(p, { valor: saldo });
  document.getElementById('pagParcial').onclick = ()=> pagamentoModal(p, {});
  document.getElementById('pagNao').onclick = ()=>{ closeModal(); render(); };
}
function wirePedidos(){
  const app = document.getElementById('app');
  if(state.pedidoAberto){
    const p = state.pedidos.find(x=>x.id===state.pedidoAberto);
    if(!p) return;
    const on = (sel, fn)=>{ app.querySelectorAll(sel).forEach(el=> el.addEventListener('click', ()=>fn(el))); };
    const salvar = async (msg)=>{ recalcStatusPedido(p); recalcPagamento(p); const ok = await savePedidos(); if(ok && msg) toast(msg); render(); };

    on('[data-act=voltarlista]', ()=>{ state.pedidoAberto=null; render(); });
    on('[data-act=advance]', ()=>{
      prazoModal(p.prazoDias||5, async dias=>{
        p.status = 'pedido'; p.convertidoEmPedidoEm = new Date().toISOString(); p.prazoDias = dias;
        criarPartesIniciais(p);
        const ok = await savePedidos(); if(ok) toast('Convertido em pedido'); render();
        perguntarPagamento(p);
      });
    });
    on('[data-act=avancarparte]', async el=>{
      const pt = getPartes(p).find(x=>x.id===el.dataset.parte); if(!pt) return;
      const nx = partNext(pt.status); if(!nx) return;
      pt.status = nx; if(nx==='a_receber') pt.entregueEm = new Date().toISOString();
      await salvar('Parte '+pt.id+' atualizada');
      if(nx==='a_receber') perguntarPagamento(p);
    });
    on('[data-act=voltarparte]', async el=>{
      const pt = getPartes(p).find(x=>x.id===el.dataset.parte); if(!pt) return;
      const pv = partPrev(pt.status); if(!pv) return;
      pt.status = pv; delete pt.entregueEm;
      await salvar('Etapa revertida');
    });
    on('[data-act=moveritens]', el=> moverItensModal(p, el.dataset.parte));
    on('[data-act=finalizarpedido]', async ()=>{
      const saldo = saldoPedido(p);
      if(saldo>0.005 && !confirm('Ainda há R$ '+money(saldo)+' a receber deste pedido. Finalizar mesmo assim?')) return;
      if(saldo<-0.005 && !confirm('O cliente tem R$ '+money(-saldo)+' a receber de volta. Finalizar mesmo assim?')) return;
      p.status = 'finalizado'; await salvar('Pedido finalizado');
    });
    on('[data-act=reabrirpedido]', async ()=>{ p.status = 'a_receber'; recalcStatusPedido(p); await salvar('Pedido reaberto'); });
    on('[data-act=voltarorcamento]', async ()=>{
      if((p.pagamentos||[]).length){ toast('Há pagamentos lançados — exclua-os antes de voltar para orçamento'); return; }
      if(!confirm('Voltar este pedido para Orçamento? As partes serão desfeitas.')) return;
      p.status = 'orcamento'; delete p.partes;
      (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{ delete it.alloc; }));
      await salvar('Voltou para orçamento');
    });
    on('[data-act=novopag]', ()=> pagamentoModal(p, {}));
    on('[data-act=receberrestante]', ()=> pagamentoModal(p, { valor: saldoPedido(p) }));
    on('[data-act=reembolso]', ()=> pagamentoModal(p, { tipo:'reembolso', valor: -saldoPedido(p) }));
    on('[data-act=delpag]', async el=>{
      if(!confirm('Excluir este lançamento de pagamento?')) return;
      p.pagamentos = (p.pagamentos||[]).filter(x=>x.id!==el.dataset.id); await salvar('Lançamento excluído');
    });
    on('[data-act=novadevolucao]', ()=> devolucaoModal(p));
    on('[data-act=deldev]', async el=>{
      if(!confirm('Excluir esta devolução?')) return;
      p.devolucoes = (p.devolucoes||[]).filter(x=>x.id!==el.dataset.id); await salvar('Devolução excluída');
    });
    const vfInput = app.querySelector('#valorFornecedorInput'); if(vfInput) vfInput.addEventListener('change', async e=>{
      p.valorFornecedor = parseNum(e.target.value);
      await savePedidos();
    });
    on('[data-act=togglefornecedorpago]', async ()=>{ p.fornecedorPago = !p.fornecedorPago; await salvar(p.fornecedorPago?'Material marcado como pago':'Marcado como pendente'); });
    on('[data-act=cancelar]', async ()=>{
      if(confirm('Cancelar este pedido? Ele continuará no sistema como cancelado.')){ p.status='cancelado'; await salvar('Pedido cancelado'); }
    });
    on('[data-act=reimprimir]', ()=> gerarPDFdePedido(p));
    on('[data-act=gerarproducao]', ()=> mostrarProducaoPreview(p));
    on('[data-act=gerarproducaoparte]', el=> mostrarProducaoPreview(pedidoDaParte(p, el.dataset.parte)));
    on('[data-act=editarpedido]', ()=> carregarPedidoParaEdicao(p));
    return;
  }
  app.querySelectorAll('[data-open]').forEach(row=> row.addEventListener('click', ()=>{ state.pedidoAberto=row.dataset.open; render(); }));
  app.querySelectorAll('[data-setfilter]').forEach(btn=> btn.addEventListener('click', ()=>{ state.pedidosFilter = btn.dataset.setfilter || null; render(); }));
  const cf = app.querySelector('[data-act=clearfilter]'); if(cf) cf.addEventListener('click', ()=>{ state.pedidosFilter=null; render(); });
  const arel = app.querySelector('[data-act=abrirrelatorio]'); if(arel) arel.addEventListener('click', ()=>{ state.tab='relatorio'; render(); });
  const numSearch = app.querySelector('#pedidoNumSearch'); if(numSearch) numSearch.addEventListener('input', e=>{
    state.pedidoNumBusca = e.target.value;
    const wrap = document.getElementById('pedidosRowsWrap');
    if(wrap){ wrap.innerHTML = pedidosRowsHtml(); wirePedidosRows(); }
  });
  const cliSearch = app.querySelector('#pedidoCliSearch'); if(cliSearch) cliSearch.addEventListener('input', e=>{
    state.pedidoClienteBusca = e.target.value;
    const wrap = document.getElementById('pedidosRowsWrap');
    if(wrap){ wrap.innerHTML = pedidosRowsHtml(); wirePedidosRows(); }
  });
  const mesSelect = app.querySelector('#pedidoMesSelect'); if(mesSelect) mesSelect.addEventListener('change', e=>{
    state.pedidoMesBusca = e.target.value;
    const wrap = document.getElementById('pedidosRowsWrap');
    if(wrap){ wrap.innerHTML = pedidosRowsHtml(); wirePedidosRows(); }
  });
}

/* ================= RELATÓRIOS DE PEDIDOS ================= */
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function relEstado(){
  if(!state.rel){
    const h = new Date();
    state.rel = { de: isoLocal(new Date(h.getFullYear(), h.getMonth(), 1)), ate: isoLocal(h), cliente:'', vendedor:'', status:'ativos', forma:'', modo:'resumido', agrupar:'nenhum' };
  }
  return state.rel;
}
const REL_STATUS = [
  ['ativos','Pedidos (sem orçamentos e cancelados)'], ['todos','Todos (inclui orçamentos e cancelados)'], ['orcamento','Somente orçamentos'],
  ['pedido','Em produção'], ['entrega','Aguardando entrega'], ['entregando','Entregando'], ['a_receber','Entregues (a receber)'],
  ['finalizado','Finalizados'], ['cancelado','Cancelados']
];
function somaRows(rows){
  return rows.reduce((t,r)=>({ n:t.n+1, itens:t.itens+r.itens, total:t.total+r.total, devolvido:t.devolvido+r.devolvido, liquido:t.liquido+r.liquido, recebido:t.recebido+r.recebido, saldo:t.saldo+r.saldo }),
    { n:0, itens:0, total:0, devolvido:0, liquido:0, recebido:0, saldo:0 });
}
function relDados(){
  const f = relEstado();
  const q = normSearch(f.cliente||'');
  const rows = [];
  state.pedidos.forEach(p=>{
    const dt = new Date(p.createdAt); const ds = isoLocal(dt);
    if(f.de && ds < f.de) return;
    if(f.ate && ds > f.ate) return;
    if(f.status==='ativos'){ if(p.status==='orcamento' || p.status==='cancelado') return; }
    else if(f.status!=='todos' && p.status!==f.status) return;
    if(q && !normSearch(p.clientName||'').includes(q)) return;
    const vend = p.vendedorNome || '(sem vendedor)';
    if(f.vendedor && vend!==f.vendedor) return;
    const formasArr = [...new Set((p.pagamentos||[]).filter(x=>x.tipo!=='reembolso').map(x=>x.forma).filter(Boolean))];
    if(f.forma && !formasArr.includes(f.forma)) return;
    const orc = p.status==='orcamento';
    rows.push({ p, id:p.id, numero:p.numero||'', dt, dataStr:dt.toLocaleDateString('pt-BR'), cliente:p.clientName||'Sem nome', vendedor:vend,
      status:p.status, statusLabel:STATUS_LABEL[p.status]||p.status, formas: formasArr.join(' + ') || '—',
      total:p.total||0, devolvido:totalDevolvido(p), liquido:totalLiquido(p),
      recebido: orc ? 0 : recebidoLiquido(p), saldo: orc ? 0 : saldoPedido(p), itens:totalItensPedido(p) });
  });
  rows.sort((a,b)=> a.dt-b.dt || (parseInt(a.numero,10)||0)-(parseInt(b.numero,10)||0));
  let grupos;
  if(f.agrupar==='nenhum') grupos = [{ nome:null, rows }];
  else {
    const map = new Map();
    rows.forEach(r=>{
      let k, nome;
      if(f.agrupar==='cliente'){ nome=r.cliente; k=normSearch(nome); }
      else if(f.agrupar==='vendedor'){ nome=r.vendedor; k=nome; }
      else if(f.agrupar==='data'){ k=isoLocal(r.dt); nome=r.dataStr; }
      else { k=r.dt.getFullYear()*100+r.dt.getMonth(); nome=MES_NOMES[r.dt.getMonth()]+'/'+r.dt.getFullYear(); }
      if(!map.has(k)) map.set(k, { nome, rows:[], ord:k });
      map.get(k).rows.push(r);
    });
    grupos = [...map.values()];
    if(f.agrupar==='cliente' || f.agrupar==='vendedor') grupos.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
    else grupos.sort((a,b)=> (a.ord>b.ord)-(a.ord<b.ord));
  }
  grupos.forEach(g=>{ g.tot = somaRows(g.rows); });
  return { rows, grupos, tot: somaRows(rows) };
}
function relFiltrosTexto(){
  const f = relEstado(); const t = [];
  t.push('Período: '+(f.de?dataBR(f.de):'início')+' a '+(f.ate?dataBR(f.ate):'hoje'));
  if(f.cliente) t.push('Cliente: '+f.cliente);
  if(f.vendedor) t.push('Vendedor: '+f.vendedor);
  t.push('Situação: '+((REL_STATUS.find(x=>x[0]===f.status)||[,''])[1]));
  if(f.forma) t.push('Forma de pagamento: '+f.forma);
  if(f.agrupar!=='nenhum') t.push('Agrupado por '+f.agrupar);
  return t.join(' · ');
}
function relLinhaResumo(r){
  const orc = r.status==='orcamento';
  return `<tr class="clk" data-open-rel="${r.id}"><td>${escapeHtml(r.numero)}</td><td>${r.dataStr}</td><td>${escapeHtml(r.cliente)}</td><td>${escapeHtml(r.vendedor)}</td><td>${escapeHtml(r.statusLabel)}</td><td>${escapeHtml(r.formas)}</td><td class="r num">${money(r.total)}</td><td class="r num">${orc?'—':money(r.recebido)}</td><td class="r num">${orc?'—':money(r.saldo)}</td></tr>`;
}
function relTabelaResumida(d){
  const corpo = d.grupos.map(g=>{

    return cab + g.rows.map(relLinhaResumo).join('');
  }).join('');
  const t = d.tot;
  return `<div class="rel-wrap"><table class="rel-table">

    <tbody>${corpo}</tbody>

      <tr class="tot"><td colspan="6">TOTAL GERAL — ${t.n} pedido${t.n>1?'s':''} (${fmtQtd(t.itens)} itens)</td><td class="r num">${money(t.total)}</td><td class="r num">${money(t.recebido)}</td><td class="r num">${money(t.saldo)}</td></tr>
      ${t.devolvido>0.005?`<tr><td colspan="6">Devoluções</td><td class="r num">- ${money(t.devolvido)}</td><td></td><td></td></tr><tr class="tot"><td colspan="6">TOTAL LÍQUIDO</td><td class="r num">${money(t.liquido)}</td><td></td><td></td></tr>`:''}
    </tfoot></table></div>`;
}
function relPedidoBloco(r){
  const p = r.p; const pctRaw = p.parcelPercentRaw||0;
  const partes = (p.partes||[]);
  const secs = (p.sections||[]).map(sec=>{
    const pct = sectionPct(sec, pctRaw);
    const linhas = sec.items.map(it=>{
      const qty = parseNum(it.qty), unit = parseNum(it.price)*(1+pct/100);
      return `<tr><td>${escapeHtml(it.name)}</td><td class="r">${fmtQtd(qty)}</td><td class="r num">${money(unit)}</td><td class="r num">${money(qty*unit)}</td></tr>`;
    }).join('');
    return `<tr class="sec"><td colspan="4">${escapeHtml(sec.title)}</td></tr>${linhas}`;
  }).join('');
  const desc = calcDescontoPedido(p);
  const taxas = (p.total||0) - ((p.subtotal||0) - desc);
  const orc = r.status==='orcamento';
  const pags = (p.pagamentos||[]).map(x=>(x.tipo==='reembolso'?'Reembolso ':'')+'R$ '+money(x.valor)+' '+(x.forma||'')+' ('+dataBR(x.data)+')').join(' · ');
  const devs = (p.devolucoes||[]).map(x=>x.qty+'x '+x.nome+' (R$ '+money(x.valor)+', '+dataBR(x.data)+')').join(' · ');
  const pts = partes.length>1 ? partes.map(pt=>pt.id+' — '+PART_LABEL[pt.status]).join(' · ') : '';
  return `<div class="rel-pedido">
    <div class="rel-ped-head"><b>Nº ${escapeHtml(r.numero)}</b> — ${escapeHtml(r.cliente)} · ${r.dataStr} · Vendedor: ${escapeHtml(r.vendedor)} · ${escapeHtml(r.statusLabel)}${orc?'':' · Pagto: '+escapeHtml(r.formas)}</div>
    <div class="rel-wrap"><table class="rel-table"><thead><tr><th>Item</th><th class="r">Qtd</th><th class="r">Valor unit.</th><th class="r">Valor total</th></tr></thead><tbody>${secs}</tbody></table></div>
    <div class="rel-ped-tot">
      <span>Subtotal: <b class="num">R$ ${money(p.subtotal||0)}</b></span>
      ${desc>0.005?`<span>Desconto: <b class="num">- R$ ${money(desc)}</b></span>`:''}
      ${Math.abs(taxas)>0.005?`<span>Taxas: <b class="num">R$ ${money(taxas)}</b></span>`:''}
      <span>Total: <b class="num">R$ ${money(r.total)}</b></span>
      ${r.devolvido>0.005?`<span>Devolvido: <b class="num">- R$ ${money(r.devolvido)}</b></span>`:''}
      ${orc?'':`<span>Recebido: <b class="num">R$ ${money(r.recebido)}</b></span><span>Saldo: <b class="num">R$ ${money(r.saldo)}</b></span>`}
    </div>
    ${pts?`<div class="rel-ped-note">Partes: ${escapeHtml(pts)}</div>`:''}
    ${p.entregaObs?`<div class="rel-ped-note">Entrega: ${escapeHtml(p.entregaObs)}</div>`:''}
    ${pags?`<div class="rel-ped-note">Pagamentos: ${escapeHtml(pags)}</div>`:''}
    ${devs?`<div class="rel-ped-note">Devoluções: ${escapeHtml(devs)}</div>`:''}
  </div>`;
}
function relDetalhado(d){
  const corpo = d.grupos.map(g=>{
    const cab = g.nome!==null ? `<div class="rel-grp"><span>${escapeHtml(g.nome)} · ${g.tot.n} pedido${g.tot.n>1?'s':''}</span><span class="num">Total R$ ${money(g.tot.total)}</span></div>` : '';
    return cab + g.rows.map(relPedidoBloco).join('');
  }).join('');
  const t = d.tot;
  return corpo + `<div class="rel-grp" style="margin-top:14px;"><span>TOTAL GERAL — ${t.n} pedido${t.n>1?'s':''} (${fmtQtd(t.itens)} itens)</span><span class="num">R$ ${money(t.total)}${t.devolvido>0.005?' · líquido R$ '+money(t.liquido):''}</span></div>`;
}
function relResultadoHtml(){
  const d = relDados(); const f = relEstado();
  if(!d.rows.length) return `<div class="empty-state">Nenhum pedido encontrado com esses filtros.</div>`;
  const t = d.tot;
  const kpis = `<div class="rel-kpis">
    <div class="rel-kpi"><b>${t.n}</b><span>Pedidos</span></div>
    <div class="rel-kpi"><b class="num">R$ ${money(t.total)}</b><span>Valor total dos pedidos</span></div>
    ${t.devolvido>0.005?`<div class="rel-kpi"><b class="num">R$ ${money(t.devolvido)}</b><span>Devolvido</span></div>`:''}
    <div class="rel-kpi"><b class="num">R$ ${money(t.recebido)}</b><span>Recebido</span></div>
    <div class="rel-kpi"><b class="num">R$ ${money(t.saldo)}</b><span>Saldo a receber</span></div>
  </div>`;
  return kpis + (f.modo==='detalhado' ? relDetalhado(d) : relTabelaResumida(d));
}

function relCabecalhoImpressao(){

  return `<div class="rel-head">${logo}<div><h1>${escapeHtml(cfg.empresa||APP.empresaNome)}</h1><div style="font-size:12px;">Relatório de pedidos — ${f.modo==='detalhado'?'completo':'resumido'}</div></div></div>

function imprimirRelatorio(){
  let root = document.getElementById('printRoot');
  if(!root){ root = document.createElement('div'); root.id = 'printRoot'; document.body.appendChild(root); }
  root.innerHTML = `<div class="rel-print">${relCabecalhoImpressao()}${relResultadoHtml()}</div>`;
  document.body.classList.add('printing');
  const limpar = ()=>{ document.body.classList.remove('printing'); root.innerHTML=''; window.removeEventListener('afterprint', limpar); };
