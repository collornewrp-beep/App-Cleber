function exportarRelatorioExcel(){
  if(typeof XLSX === 'undefined'){ toast('Não consegui carregar o Excel — verifique a internet e tente de novo'); return; }
  const d = relDados(); const f = relEstado();
  if(!d.rows.length){ toast('Nenhum pedido para exportar'); return; }
  let linhas = [];
  if(f.modo==='detalhado'){
    d.rows.forEach(r=>{
      const pctRaw = r.p.parcelPercentRaw||0;
      (r.p.sections||[]).forEach(sec=>{
        const pct = sectionPct(sec, pctRaw);
        sec.items.forEach(it=>{
          const qty = parseNum(it.qty), unit = parseNum(it.price)*(1+pct/100);
          linhas.push({ Pedido:r.numero, Data:r.dataStr, Cliente:r.cliente, Vendedor:r.vendedor, Situação:r.statusLabel, 'Forma de pagamento':r.formas, Seção:sec.title, Item:it.name, Quantidade:qty, 'Valor unitário':Number(unit.toFixed(2)), 'Valor total':Number((qty*unit).toFixed(2)) });
        });
      });
    });
  } else {
    linhas = d.rows.map(r=>({ Pedido:r.numero, Data:r.dataStr, Cliente:r.cliente, Vendedor:r.vendedor, Situação:r.statusLabel, 'Forma de pagamento':r.formas,
      Itens:r.itens, Total:Number(r.total.toFixed(2)), Devolvido:Number(r.devolvido.toFixed(2)), 'Total líquido':Number(r.liquido.toFixed(2)), Recebido:Number(r.recebido.toFixed(2)), Saldo:Number(r.saldo.toFixed(2)) }));
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(linhas), 'Relatório');
  try{ XLSX.writeFile(wb, `relatorio-pedidos-${todayStr()}.xlsx`); toast('Relatório exportado!'); }
  catch(e){ toast('Não consegui exportar agora, tenta de novo'); }
}
function wireRelatorio(){
  const app = document.getElementById('app'); const f = relEstado();
  const wireLinhas = ()=> app.querySelectorAll('[data-open-rel]').forEach(tr=> tr.addEventListener('click', ()=> abrirPedido(tr.dataset.openRel)));
  const refresh = ()=>{ const box = document.getElementById('relResultado'); if(box){ box.innerHTML = relResultadoHtml(); wireLinhas(); } };
  const bind = (id, key, ev)=>{ const el = app.querySelector('#'+id); if(el) el.addEventListener(ev||'change', e=>{ f[key] = e.target.value; refresh(); }); };
  bind('relDe','de'); bind('relAte','ate'); bind('relVendedor','vendedor'); bind('relStatus','status'); bind('relForma','forma');
  bind('relModo','modo'); bind('relAgrupar','agrupar'); bind('relCliente','cliente','input');
  app.querySelectorAll('[data-relper]').forEach(btn=> btn.addEventListener('click', ()=>{
    const h = new Date(); const per = btn.dataset.relper;
    if(per==='mes'){ f.de = isoLocal(new Date(h.getFullYear(), h.getMonth(), 1)); f.ate = isoLocal(h); }
    else if(per==='mespassado'){ f.de = isoLocal(new Date(h.getFullYear(), h.getMonth()-1, 1)); f.ate = isoLocal(new Date(h.getFullYear(), h.getMonth(), 0)); }
    else { f.de = ''; f.ate = ''; }
    app.querySelector('#relDe').value = f.de; app.querySelector('#relAte').value = f.ate; refresh();
  }));
  const back = app.querySelector('[data-act=voltarpedidos]'); if(back) back.addEventListener('click', ()=>{ state.tab='pedidos'; render(); });
  const pr = app.querySelector('[data-act=relimprimir]'); if(pr) pr.addEventListener('click', imprimirRelatorio);
  const ex = app.querySelector('[data-act=relexcel]'); if(ex) ex.addEventListener('click', exportarRelatorioExcel);
  wireLinhas();
}

/* ================= FINANCEIRO ================= */
function financeiroMesAtual(){
  if(!state.financeiroMes){ const d=new Date(); state.financeiroMes = { ano:d.getFullYear(), mes:d.getMonth() }; }
  return state.financeiroMes;
}
function fornecedorDoPedido(p){
  const totais = {};
  (p.sections||[]).forEach(sec=>sec.items.forEach(it=>{
    const prod = it.productId ? state.products.find(x=>x.id===it.productId) : null;
    const nome = (prod && prod.fornecedor) ? prod.fornecedor : 'Sem fornecedor';
    totais[nome] = (totais[nome]||0) + parseNum(it.qty)*parseNum(it.price);
  }));
  let melhor = 'Sem fornecedor', max = -1;
  Object.entries(totais).forEach(([nome,val])=>{ if(val>max){ max=val; melhor=nome; } });
  return melhor;
}
function financeiroKpiData(){
  const fm = financeiroMesAtual();
  const doMes = state.pedidos.filter(p=>{ const d=new Date(p.createdAt); return d.getFullYear()===fm.ano && d.getMonth()===fm.mes && p.status!=='cancelado' && p.status!=='orcamento'; });
  return {
    doMes,
    recebidosList: doMes.filter(p=>recebidoLiquido(p)>0.005),
    aReceberList: doMes.filter(p=>saldoPedido(p)>0.005),
    cartaoList: doMes.filter(p=>(p.parcelaAddValor||0)>0),
    pagoFornecedorList: doMes.filter(p=>p.fornecedorPago)
  };
}
function renderFinanceiro(){
  const fm = financeiroMesAtual();
  const doMes = state.pedidos.filter(p=>{ const d=new Date(p.createdAt); return d.getFullYear()===fm.ano && d.getMonth()===fm.mes && p.status!=='cancelado' && p.status!=='orcamento'; });
  const gasto = doMes.reduce((s,p)=>s+custoLiquido(p),0);
  const ganho = doMes.reduce((s,p)=>s+margemLiquida(p),0);
  const recebido = doMes.reduce((s,p)=>s+Math.max(0,recebidoLiquido(p)),0);
  const aReceber = doMes.reduce((s,p)=>s+Math.max(0,saldoPedido(p)),0);
  const taxaCartao = doMes.reduce((s,p)=>s+(p.parcelaAddValor||0),0);
  const pagoFornecedor = doMes.filter(p=>p.fornecedorPago).reduce((s,p)=>s+(parseNum(p.valorFornecedor)||0),0);

  // controle por fornecedor (pendências de pagamento, agrupadas pelo fornecedor predominante do pedido)
  const pendentesFornecedor = state.pedidos.filter(p=>p.status!=='orcamento' && p.status!=='cancelado' && parseNum(p.valorFornecedor)>0 && !p.fornecedorPago);
  const porFornecedor = {};
  pendentesFornecedor.forEach(p=>{
    const nome = fornecedorDoPedido(p);
    if(!porFornecedor[nome]) porFornecedor[nome] = { total:0, pedidos:[] };
    porFornecedor[nome].total += parseNum(p.valorFornecedor);
    porFornecedor[nome].pedidos.push(p);
  });

  return `
  <div class="card">
    <div class="row" style="align-items:center;">
      <button class="btn-ghost btn-sm" data-act="mesprev">← Mês anterior</button>
      <div style="flex:2; text-align:center; font-weight:700; font-size:15px;">${MES_NOMES[fm.mes]}/${fm.ano}</div>
      <button class="btn-ghost btn-sm" data-act="mesnext">Próximo mês →</button>
    </div>
  </div>
  <div class="card">
    <div class="grid2">
      <button class="kpi" data-kpi="gasto"><div class="kv num">R$ ${money(gasto)}</div><div class="kl">Gasto com material</div></button>
      <button class="kpi" data-kpi="lucro"><div class="kv num" style="color:var(--success);">R$ ${money(ganho)}</div><div class="kl">Lucro no mês</div></button>
      <button class="kpi" data-kpi="recebido"><div class="kv num">R$ ${money(recebido)}</div><div class="kl">Já recebido</div></button>
      <button class="kpi" data-kpi="areceber"><div class="kv num" style="color:var(--accent-dark);">R$ ${money(aReceber)}</div><div class="kl">Ainda a receber</div></button>
      <button class="kpi" data-kpi="cartao"><div class="kv num" style="color:var(--info);">R$ ${money(taxaCartao)}</div><div class="kl">Despesa de cartão (parcelamento)</div></button>
      <button class="kpi" data-kpi="pagofornecedor"><div class="kv num" style="color:var(--danger);">R$ ${money(pagoFornecedor)}</div><div class="kl">Pago a fornecedores</div></button>
    </div>
  </div>
  ${Object.keys(porFornecedor).length>0 ? `
  <div class="card">
    <div class="eyebrow">Controle por fornecedor (pendente de pagamento)</div>
    ${Object.entries(porFornecedor).map(([nome,info])=>`
      <div class="list-row" style="align-items:flex-start;">
        <div class="info"><b>${escapeHtml(nome)}</b><span>${info.pedidos.length} pedido${info.pedidos.length>1?'s':''} pendente${info.pedidos.length>1?'s':''}</span></div>
        <div style="text-align:right;">
          <div style="font-weight:700; color:var(--danger); margin-bottom:6px;">R$ ${money(info.total)}</div>
          <button class="btn-sm btn-success" data-act="pagarfornecedorlote" data-fornecedor="${escapeHtml(nome)}">Marcar tudo pago</button>
        </div>
      </div>
      ${info.pedidos.map(p=>`
      <div class="list-row" style="padding-left:10px; font-size:13px;">
        <div class="info"><span>${p.numero?`Nº ${escapeHtml(p.numero)}`:'Pedido'} — ${escapeHtml(p.clientName||'')}</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="num">R$ ${money(p.valorFornecedor)}</span>
          <button class="btn-sm btn-ghost" data-act="pagarfornecedorunico" data-pedido="${p.id}">Pago</button>
        </div>
      </div>`).join('')}
    `).join('')}
  </div>` : ''}
  `;
}
function wireFinanceiro(){
  const app = document.getElementById('app');
  const fm = financeiroMesAtual();
  const fd = financeiroKpiData();
  const fKpiMap = {
    gasto: { title:'Gasto com material', list: fd.doMes },
    lucro: { title:'Lucro no mês', list: fd.doMes },
    recebido: { title:'Já recebido', list: fd.recebidosList },
    areceber: { title:'Ainda a receber', list: fd.aReceberList },
    cartao: { title:'Despesa de cartão (parcelamento)', list: fd.cartaoList },
    pagofornecedor: { title:'Pago a fornecedores', list: fd.pagoFornecedorList }
  };
  app.querySelectorAll('[data-kpi]').forEach(el=> el.addEventListener('click', ()=>{
    const info = fKpiMap[el.dataset.kpi];
    if(info) listaPedidosModal(info.title, info.list);
  }));
  const prev = app.querySelector('[data-act=mesprev]'); if(prev) prev.addEventListener('click', ()=>{
    let {ano,mes} = fm; mes--; if(mes<0){ mes=11; ano--; } state.financeiroMes={ano,mes}; render();
  });
  const next = app.querySelector('[data-act=mesnext]'); if(next) next.addEventListener('click', ()=>{
    let {ano,mes} = fm; mes++; if(mes>11){ mes=0; ano++; } state.financeiroMes={ano,mes}; render();
  });
  app.querySelectorAll('[data-act=pagarfornecedorunico]').forEach(btn=> btn.addEventListener('click', async ()=>{
    const p = state.pedidos.find(x=>x.id===btn.dataset.pedido);
    if(p){ p.fornecedorPago = true; const ok = await savePedidos(); if(ok) toast('Marcado como pago'); render(); }
  }));
  app.querySelectorAll('[data-act=pagarfornecedorlote]').forEach(btn=> btn.addEventListener('click', async ()=>{
    const nome = btn.dataset.fornecedor;
    state.pedidos.forEach(p=>{
      if(p.status!=='orcamento' && p.status!=='cancelado' && parseNum(p.valorFornecedor)>0 && !p.fornecedorPago){
        if(fornecedorDoPedido(p)===nome) p.fornecedorPago = true;
      }
    });
    const ok = await savePedidos(); if(ok) toast('Todos marcados como pagos'); render();
  }));
}

function renderProdutos(){

      <div class="row" style="gap:6px;">

        </select>

    </div>
    <div class="card" id="prodResultsWrap">${prodRowsHtml()}</div>`;
}
function prodRowsHtml(){
  const cfg = state.config;
  const inst = cfg.installments[cfg.parceladoPadraoIdx];
  const pct = inst ? parseNum(inst.percent) : 0;
  const vezesLabel = inst ? `${inst.vezes}x` : 'A prazo';
  const filtered = state.products.filter(p=>{
    const matchTexto = !prodFilter || normSearch(p.name).includes(normSearch(prodFilter)) || normSearch(p.fornecedor||'').includes(normSearch(prodFilter));
    const matchForn = !prodFornFilter || p.fornecedor===prodFornFilter;
    return matchTexto && matchForn;
  });
  if(!filtered.length) return `<div class="empty-state">Nenhum produto cadastrado ainda.</div>`;
  const head = `<div class="prod-table-head"><span>Produto</span><span class="r" style="text-align:right;">Custo</span><span class="r" style="text-align:right;">À vista</span><span class="r" style="text-align:right;">${escapeHtml(vezesLabel)}</span></div>`;
  const rows = filtered.map(p=>{
    const avista = parseNum(p.prices[0]||0);
    const aprazo = avista*(1+pct/100);
    return `<div class="prod-table-row" data-act="editprod" data-id="${p.id}">
      <div class="pnamewrap"><span class="pname">${escapeHtml(p.name)}</span>${p.fornecedor?`<span class="pforn">${escapeHtml(p.fornecedor)}</span>`:''}</div>
      <span class="num r" style="text-align:right; opacity:.6;">${money(p.cost||0)}</span>
      <span class="num r" style="text-align:right;">${money(avista)}</span>
      <span class="num r" style="text-align:right;">${money(aprazo)}</span>
    </div>`;
  }).join('');
  return head + rows;
}
function wireProdRows(){
  document.querySelectorAll('[data-act=editprod]').forEach(el=> el.addEventListener('click', ()=> productModal(state.products.find(p=>p.id===el.dataset.id))));
}
function productModal(prod){
  const labels = state.config.priceLabels; const isNew = !prod;
  prod = prod || { id:uid(), name:"", cost:"", prices:labels.map(()=>""), fornecedor:state.config.fornecedores[0]||"" };
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
    <div class="modal-head"><h3>${isNew?'Novo produto':'Editar produto'}</h3><button id="mclose">✕</button></div>
    <div class="field"><label>Nome do produto</label><input type="text" id="pname" value="${escapeHtml(prod.name)}" placeholder="Ex: Textura Grafiato 25kg"></div>
    <div class="field"><label>Fornecedor</label><select id="pfornecedor">${state.config.fornecedores.map(f=>`<option value="${escapeHtml(f)}" ${(prod.fornecedor||state.config.fornecedores[0])===f?'selected':''}>${escapeHtml(f)}</option>`).join('')}</select></div>
    <div class="field"><label>Seu custo (o que você paga) (R$)</label><input type="text" inputmode="numeric" id="pcost" placeholder="0,00"></div>
    ${labels.map((l,i)=>`<div class="field"><label>${escapeHtml(l)} — preço de venda (R$)</label><input type="text" inputmode="numeric" id="pprice${i}" placeholder="0,00"></div>`).join('')}
    <div class="row" style="margin-top:14px;">${!isNew?`<button class="btn-danger btn-block" id="pdel">Excluir</button>`:''}<button class="btn-primary btn-block" id="psave">Salvar</button></div>
  </div></div>`;
  document.getElementById('mclose').onclick = closeModal;
  document.getElementById('mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') closeModal(); });
  noAccentInput(document.getElementById('pname'));
  document.getElementById('pname').focus();
  const pcostEl = document.getElementById('pcost'); wireMoneyInput(pcostEl); setMoneyInputValue(pcostEl, prod.cost);
  labels.forEach((_,i)=>{ const el = document.getElementById('pprice'+i); wireMoneyInput(el); setMoneyInputValue(el, prod.prices[i]); });
  const del = document.getElementById('pdel'); if(del) del.onclick = ()=>{ if(confirm('Excluir este produto?')){ state.products=state.products.filter(p=>p.id!==prod.id); saveProducts(); closeModal(); render(); toast('Produto excluído'); } };
  document.getElementById('psave').onclick = async ()=>{
    const name = document.getElementById('pname').value.trim(); if(!name){ toast('Digite o nome do produto'); return; }
    prod.name=name; prod.cost = moneyInputToNumber(document.getElementById('pcost').value);
    prod.fornecedor = document.getElementById('pfornecedor').value;
    prod.prices = labels.map((_,i)=>moneyInputToNumber(document.getElementById('pprice'+i).value));
    if(isNew) state.products.push(prod); else { const idx=state.products.findIndex(p=>p.id===prod.id); state.products[idx]=prod; }
    const ok = await saveProducts(); closeModal(); render(); if(ok) toast('Produto salvo');
  };
}

function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function maskCPF(v){ const d=soDigitos(v).slice(0,11); let o=d.slice(0,3); if(d.length>3) o+='.'+d.slice(3,6); if(d.length>6) o+='.'+d.slice(6,9); if(d.length>9) o+='-'+d.slice(9,11); return o; }
function maskCNPJ(v){ const d=soDigitos(v).slice(0,14); let o=d.slice(0,2); if(d.length>2) o+='.'+d.slice(2,5); if(d.length>5) o+='.'+d.slice(5,8); if(d.length>8) o+='/'+d.slice(8,12); if(d.length>12) o+='-'+d.slice(12,14); return o; }
function maskCEP(v){ const d=soDigitos(v).slice(0,8); return d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d; }
function validaCPF(v){
  const c=soDigitos(v); if(c.length!==11 || /^(\d)\1+$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=(+c[i])*(10-i);
  let d=(s*10)%11%10; if(d!==+c[9]) return false;
  s=0; for(let i=0;i<10;i++) s+=(+c[i])*(11-i);
  d=(s*10)%11%10; return d===+c[10];
}
function validaCNPJ(v){
  const c=soDigitos(v); if(c.length!==14 || /^(\d)\1+$/.test(c)) return false;
  const calc=(n)=>{ let s=0, p=n-7; for(let i=0;i<n;i++){ s+=(+c[i])*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13];
}
function enderecoCompletoCliente(c){
  if(!c) return '';
  const partes=[];
  const rua=[c.address, c.numero].filter(Boolean).join(', ');
  if(rua) partes.push(rua);
  if(c.complemento) partes.push(c.complemento);
  if(c.bairro) partes.push(c.bairro);
  const cidUf=[c.cidade, c.uf].filter(Boolean).join('/');
  if(cidUf) partes.push(cidUf);
  if(c.cep) partes.push('CEP '+c.cep);
  return partes.join(' - ');
}
function clienteMatches(c, q){
  if(!q) return true;
  const nq=normSearch(q); const dq=soDigitos(q);
  return normSearch(c.name).includes(nq) || normSearch(c.fantasia||'').includes(nq) ||
    (dq.length>=3 && (soDigitos(c.doc).includes(dq) || soDigitos(c.phone).includes(dq) || soDigitos(c.phone2).includes(dq)));
}

function cliRowsHtml(){
  const filtered = (cliFilter ? state.clients.filter(c=>clienteMatches(c,cliFilter)) : state.clients.slice())
    .sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR'));
  return filtered.map(c=>{
    const sub=[c.doc, c.phone, [c.cidade,c.uf].filter(Boolean).join('/')].filter(Boolean).join(' · ');
    return `
    <div class="list-row" style="cursor:default;"><div class="info"><b>${escapeHtml(c.name)}${c.fantasia?' — '+escapeHtml(c.fantasia):''}</b><span>${escapeHtml(sub||c.address||'')}</span></div>
    <div class="actions"><button class="btn-ghost btn-sm" data-act="editcli" data-id="${c.id}">Editar</button></div></div>`; }).join('') || `<div class="empty-state">Nenhum cliente cadastrado ainda.</div>`;
}

function clientModal(cli){
  const isNew = !cli;
  cli = cli || { id:uid(), tipo:'PF', name:'', fantasia:'', doc:'', ie:'', phone:'', phone2:'', email:'', contato:'', cep:'', address:'', numero:'', complemento:'', bairro:'', cidade:'', uf:'', obs:'' };
  const v = k => escapeHtml(cli[k]||'');
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal wide">
    <div class="modal-head"><h3>${isNew?'Novo cliente':'Editar cliente'}</h3><button id="mclose">✕</button></div>
    <div class="eyebrow">Identificação</div>
    <div class="fgrid">
      <div class="field"><label>Tipo</label><select id="ctipo"><option value="PF" ${cli.tipo!=='PJ'?'selected':''}>Pessoa física</option><option value="PJ" ${cli.tipo==='PJ'?'selected':''}>Pessoa jurídica</option></select></div>
      <div class="field span2"><label id="lblName">Nome completo</label><input type="text" id="cname" value="${v('name')}"></div>
      <div class="field" id="wrapFantasia"><label>Nome fantasia</label><input type="text" id="cfantasia" value="${v('fantasia')}"></div>
      <div class="field"><label id="lblDoc">CPF</label><input type="text" inputmode="numeric" id="cdoc" value="${v('doc')}" placeholder="Somente números"></div>
      <div class="field" id="wrapIE"><label>Inscrição estadual</label><input type="text" id="cie" value="${v('ie')}"></div>
    </div>
    <div class="eyebrow" style="margin-top:6px;">Contato</div>
    <div class="fgrid">
      <div class="field"><label>Telefone</label><input type="tel" id="cphone" value="${v('phone')}"></div>
      <div class="field"><label>Celular / WhatsApp</label><input type="tel" id="cphone2" value="${v('phone2')}"></div>
      <div class="field span2"><label>E-mail</label><input type="text" id="cemail" value="${v('email')}" placeholder="cliente@exemplo.com"></div>
      <div class="field"><label>Pessoa de contato</label><input type="text" id="ccontato" value="${v('contato')}" placeholder="Ex: mestre de obras"></div>
    </div>
    <div class="eyebrow" style="margin-top:6px;">Endereço</div>
    <div class="fgrid">
      <div class="field"><label>CEP</label><input type="text" inputmode="numeric" id="ccep" value="${v('cep')}" placeholder="00000-000"></div>
      <div class="field span2"><label>Rua / Avenida</label><input type="text" id="caddr" value="${v('address')}"></div>
      <div class="field"><label>Número</label><input type="text" id="cnum" value="${v('numero')}"></div>
      <div class="field"><label>Complemento</label><input type="text" id="ccomp" value="${v('complemento')}"></div>
      <div class="field"><label>Bairro</label><input type="text" id="cbairro" value="${v('bairro')}"></div>
      <div class="field"><label>Cidade</label><input type="text" id="ccidade" value="${v('cidade')}"></div>
      <div class="field"><label>UF</label><input type="text" id="cuf" maxlength="2" value="${v('uf')}" style="text-transform:uppercase;"></div>
    </div>
    <div class="field"><label>Observações</label><textarea id="cobs" rows="3" style="resize:vertical;">${v('obs')}</textarea></div>
    <div class="row" style="margin-top:14px;">${!isNew?`<button class="btn-danger btn-block" id="cdel">Excluir</button>`:''}<button class="btn-primary btn-block" id="csave">Salvar</button></div>
  </div></div>`;
  const $ = id => document.getElementById(id);
  $('mclose').onclick = closeModal;
  $('mbg').addEventListener('click', e=>{ if(e.target.id==='mbg') closeModal(); });

  const aplicarTipo = ()=>{
    const pj = $('ctipo').value==='PJ';
    $('lblName').textContent = pj ? 'Razão social' : 'Nome completo';
    $('lblDoc').textContent = pj ? 'CNPJ' : 'CPF';
    $('wrapFantasia').classList.toggle('hidden', !pj);
    $('wrapIE').classList.toggle('hidden', !pj);
    $('cdoc').value = pj ? maskCNPJ($('cdoc').value) : maskCPF($('cdoc').value);
  };
  $('ctipo').addEventListener('change', aplicarTipo);
  $('cdoc').addEventListener('input', ()=>{ $('cdoc').value = $('ctipo').value==='PJ' ? maskCNPJ($('cdoc').value) : maskCPF($('cdoc').value); });
  aplicarTipo();

  // CEP: preenche rua, bairro, cidade e UF automaticamente (precisa de internet)
  $('ccep').addEventListener('input', async ()=>{
    $('ccep').value = maskCEP($('ccep').value);
    const d = soDigitos($('ccep').value);
    if(d.length!==8) return;
    try{
      const r = await withTimeout(fetch('https://viacep.com.br/ws/'+d+'/json/'), 8000, 'Busca de CEP');
      const j = await r.json();
      if(j.erro){ toast('CEP não encontrado'); return; }
      if(j.logradouro) $('caddr').value = j.logradouro;
      if(j.bairro) $('cbairro').value = j.bairro;
      if(j.localidade) $('ccidade').value = j.localidade;
      if(j.uf) $('cuf').value = j.uf;
      $('cnum').focus();
    }catch(e){ toast('Não consegui buscar o CEP — preencha o endereço à mão'); }
  });

  const cnameEl = $('cname');
  cnameEl.focus();
  cnameEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('cdoc').focus(); } });
  root.querySelector('.modal').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); $('csave').click(); } });
  const del = $('cdel'); if(del) del.onclick = ()=>{ if(confirm('Excluir este cliente?')){ state.clients=state.clients.filter(c=>c.id!==cli.id); saveClients(); closeModal(); render(); toast('Cliente excluído'); } };
  $('csave').onclick = async ()=>{
    const name = $('cname').value.trim(); if(!name){ toast('Digite o nome do cliente'); return; }
    const tipo = $('ctipo').value; const nomeDoc = tipo==='PJ' ? 'CNPJ' : 'CPF';
    const docDigits = soDigitos($('cdoc').value);
    if(docDigits){
      const okDoc = tipo==='PJ' ? validaCNPJ(docDigits) : validaCPF(docDigits);
      if(!okDoc){ toast(nomeDoc+' inválido — confira os números'); $('cdoc').focus(); return; }
      const dup = state.clients.find(c=>c.id!==cli.id && soDigitos(c.doc)===docDigits);
      if(dup){ toast('Já existe um cliente com esse '+nomeDoc+': '+dup.name); return; }
    }
    const email = $('cemail').value.trim();
    if(email && !/^\S+@\S+\.\S+$/.test(email)){ toast('E-mail inválido'); $('cemail').focus(); return; }
    Object.assign(cli, {
      tipo, name,
      fantasia: tipo==='PJ' ? $('cfantasia').value.trim() : '',
      doc: $('cdoc').value.trim(),
      ie: tipo==='PJ' ? $('cie').value.trim() : '',
      phone: $('cphone').value.trim(), phone2: $('cphone2').value.trim(), email,
      contato: $('ccontato').value.trim(),
      cep: $('ccep').value.trim(), address: $('caddr').value.trim(), numero: $('cnum').value.trim(),
      complemento: $('ccomp').value.trim(), bairro: $('cbairro').value.trim(), cidade: $('ccidade').value.trim(),
      uf: $('cuf').value.trim().toUpperCase(), obs: $('cobs').value.trim()
    });
    if(isNew) state.clients.push(cli); else { const idx=state.clients.findIndex(c=>c.id===cli.id); state.clients[idx]=cli; }
    const ok = await saveClients(); closeModal(); render(); if(ok) toast('Cliente salvo');
  };
}

function wireOtherTabs(){
  const app = document.getElementById('app');
  if(state.tab==='produtos'){
    const s = app.querySelector('#prodSearch'); if(s) s.addEventListener('input', e=>{ prodFilter=e.target.value; document.getElementById('prodResultsWrap').innerHTML = prodRowsHtml(); wireProdRows(); });
    const pf = app.querySelector('#prodFornSelect'); if(pf) pf.addEventListener('change', e=>{ prodFornFilter=e.target.value; document.getElementById('prodResultsWrap').innerHTML = prodRowsHtml(); wireProdRows(); });
    const nb = app.querySelector('[data-act=newprod]'); if(nb) nb.addEventListener('click', ()=>productModal(null));
    wireProdRows();
  }
  if(state.tab==='clientes'){
    const s = app.querySelector('#cliSearch'); if(s) s.addEventListener('input', e=>{ cliFilter=e.target.value; document.getElementById('cliResultsWrap').innerHTML = cliRowsHtml(); wireCliRows(); });
    const nb = app.querySelector('[data-act=newcli]'); if(nb) nb.addEventListener('click', ()=>clientModal(null));
    wireCliRows();
  }
  if(state.tab==='ajustes'){
    const cfgEnd = app.querySelector('#cfgEndereco'); if(cfgEnd) noAccentInput(cfgEnd);
    app.querySelectorAll('[data-cfgprice]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.priceLabels[Number(inp.dataset.cfgprice)]=e.target.value; }));
    const addp = app.querySelector('[data-act=addprice]'); if(addp) addp.addEventListener('click', ()=>{
      if(state.config.priceLabels.length<3){ state.config.priceLabels.push('Tabela '+(state.config.priceLabels.length+1)); state.products.forEach(p=>{ while(p.prices.length<state.config.priceLabels.length) p.prices.push(0); }); render(); }
    });
    app.querySelectorAll('[data-act=rmprice]').forEach(btn=> btn.addEventListener('click', ()=>{ const i=Number(btn.dataset.i); state.config.priceLabels.splice(i,1); state.products.forEach(p=>p.prices.splice(i,1)); render(); }));

    app.querySelectorAll('[data-inst]').forEach(inp=> inp.addEventListener('input', e=>{
      const i = Number(inp.dataset.i); const field = inp.dataset.inst;
      state.config.installments[i][field] = field==='vezes' ? parseInt(e.target.value)||1 : parseNum(e.target.value);
    }));
    const addinst = app.querySelector('[data-act=addinst]'); if(addinst) addinst.addEventListener('click', ()=>{ state.config.installments.push({vezes:state.config.installments.length+1, percent:0}); render(); });
    app.querySelectorAll('[data-act=rminst]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.installments.splice(Number(btn.dataset.i),1); render(); }));

    const addMarcaBtn = app.querySelector('#addMarca'); if(addMarcaBtn) addMarcaBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('novaMarca'); const v = inp.value.trim(); if(v){ state.config.marcas.push(v); inp.value=''; render(); }
    });
    app.querySelectorAll('[data-act=rmmarca]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.marcas.splice(Number(btn.dataset.i),1); render(); }));

    const logoFile = app.querySelector('#cfgLogoFile'); if(logoFile) logoFile.addEventListener('change', async e=>{
      if(!e.target.files[0]) return;
      try{
        state.logoDataUrl = await resizeImageFile(e.target.files[0], 320);
        await saveLogo();
        document.getElementById('logoPreviewWrap').innerHTML = `<img ${'s'+'rc'}="${state.logoDataUrl}" class="imgpreview" style="max-width:90px;">`;
        toast('Logo carregada — clique em Salvar ajustes');
      }catch(err){ toast('Não consegui carregar essa imagem, tenta outra foto'); }
    });
    const qrFile = app.querySelector('#cfgQrFile'); if(qrFile) qrFile.addEventListener('change', async e=>{
      if(!e.target.files[0]) return;
      try{
        state.qrDataUrl = await resizeImageFile(e.target.files[0], 320);
        await saveQr();
        document.getElementById('qrPreviewWrap').innerHTML = `<img ${'s'+'rc'}="${state.qrDataUrl}" class="imgpreview" style="max-width:120px;">`;
        toast('QR Code carregado — clique em Salvar ajustes');
      }catch(err){ toast('Não consegui carregar essa imagem, tenta outra foto'); }
    });

    const themeSel = app.querySelector('#cfgTheme'); if(themeSel) themeSel.addEventListener('change', e=>{ applyTheme(e.target.value); });
    const addForn = app.querySelector('[data-act=addfornecedor]'); if(addForn) addForn.addEventListener('click', ()=>{ state.config.fornecedores.push('Novo fornecedor'); render(); });
    app.querySelectorAll('[data-cfgfornecedor]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.fornecedores[Number(inp.dataset.cfgfornecedor)]=e.target.value; }));
    app.querySelectorAll('[data-act=rmfornecedor]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.fornecedores.splice(Number(btn.dataset.i),1); render(); }));
    const addVend = app.querySelector('[data-act=addvendedor]'); if(addVend) addVend.addEventListener('click', ()=>{ state.config.vendedores.push({id:uid(), nome:'', ativo:true}); render(); });
    app.querySelectorAll('[data-cfgvendedor]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.vendedores[Number(inp.dataset.cfgvendedor)].nome=e.target.value; }));
    app.querySelectorAll('[data-vendedorativo]').forEach(cb=> cb.addEventListener('change', e=>{ state.config.vendedores[Number(cb.dataset.vendedorativo)].ativo=e.target.checked; }));
    app.querySelectorAll('[data-act=rmvendedor]').forEach(btn=> btn.addEventListener('click', ()=>{
      const i=Number(btn.dataset.i); const v=state.config.vendedores[i];
      if(confirm('Remover '+(v.nome||'este vendedor')+'? Os pedidos já feitos continuam com o nome dele.')){ state.config.vendedores.splice(i,1); render(); }
    }));
    const addForma = app.querySelector('[data-act=addforma]'); if(addForma) addForma.addEventListener('click', ()=>{ state.config.formasPagamento.push('Nova forma'); render(); });
    app.querySelectorAll('[data-cfgforma]').forEach(inp=> inp.addEventListener('input', e=>{ state.config.formasPagamento[Number(inp.dataset.cfgforma)]=e.target.value; }));
    app.querySelectorAll('[data-act=rmforma]').forEach(btn=> btn.addEventListener('click', ()=>{ state.config.formasPagamento.splice(Number(btn.dataset.i),1); render(); }));

    const save = app.querySelector('[data-act=savecfg]'); if(save) save.addEventListener('click', async ()=>{
      state.config.empresa = document.getElementById('cfgEmpresa').value.trim();
      state.config.telefone = document.getElementById('cfgTel').value.trim();
      state.config.cidade = document.getElementById('cfgCidade').value.trim();
      state.config.endereco = document.getElementById('cfgEndereco').value.trim();
      state.config.email = document.getElementById('cfgEmail').value.trim();
      state.config.parceladoPadraoIdx = parseNum(document.getElementById('cfgParceladoPadrao').value) || 0;
      state.config.fornecedores = Array.from(document.querySelectorAll('[data-cfgfornecedor]')).map(inp=>inp.value.trim()).filter(Boolean);
      state.config.theme = document.getElementById('cfgTheme').value;
      state.config.vendedores = (state.config.vendedores||[]).map(v=>({id:v.id, nome:String(v.nome||'').trim(), ativo:v.ativo!==false})).filter(v=>v.nome);
      state.config.mostrarGraficoInicio = document.getElementById('cfgMostrarGrafico').checked;
      state.config.fasesAtivas = { entrega: document.getElementById('cfgFaseEntrega').checked, entregando: document.getElementById('cfgFaseEntregando').checked, a_receber: document.getElementById('cfgFaseAReceber').checked };
      state.config.formasPagamento = Array.from(document.querySelectorAll('[data-cfgforma]')).map(inp=>inp.value.trim()).filter(Boolean);
      state.config.pix.chave = document.getElementById('cfgPix').value.trim();
      state.config.feeCardDefault = { type:document.getElementById('cfgCardType').value, value:document.getElementById('cfgCardVal').value };
      state.config.feeNotaDefault = { type:document.getElementById('cfgNotaType').value, value:document.getElementById('cfgNotaVal').value };
      save.disabled = true; save.textContent = 'Salvando...';
      const ok1 = await saveConfig(); const ok2 = await saveProducts();
      save.disabled = false; save.textContent = 'Salvar ajustes';
      if(ok1 && ok2) toast('Ajustes salvos');
      checkLock(); render();
    });
    const exp = app.querySelector('[data-act=exportarexcel]'); if(exp) exp.addEventListener('click', async ()=>{ exportarDadosExcel(); await marcarBackupFeito(); });
    const expJson = app.querySelector('[data-act=exportarjson]'); if(expJson) expJson.addEventListener('click', async ()=>{ exportarBackupJSON(); await marcarBackupFeito(); });
    const impJson = app.querySelector('#cfgImportBackup'); if(impJson) impJson.addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      if(confirm('Isso vai SUBSTITUIR todos os dados atuais pelos do arquivo de backup. Tem certeza?')){ importarBackupJSON(file); }
      e.target.value = '';
    });
  }
}

function pdfProducaoHtmlFor(pedido){
  const cfg = state.config;
  const logoImg = state.logoDataUrl ? `<img ${'s'+'rc'}="${state.logoDataUrl}">` : '';
  const empresa = upper(cfg.empresa||'ORDEM DE SERVIÇO');
  const dataHoje = new Date().toLocaleDateString('pt-BR');
  const cliente = state.clients.find(c=>c.id===pedido.clientId) || state.clients.find(c=>normSearch(c.name)===normSearch(pedido.clientName||''));
  const localEntrega = String(pedido.entregaObs||'').trim() || enderecoCompletoCliente(cliente);
  const telefone = pedido.clientPhone || (cliente && cliente.phone) || '';
  let totalItens = 0;

  const secsHtml = (pedido.sections||[]).map(sec=>{
    const rows = sec.items.map(it=>{
      const prod = it.productId ? state.products.find(x=>x.id===it.productId) : null;
      const fornecedor = prod ? (prod.fornecedor||'—') : '—';
      const qty = parseNum(it.qty); totalItens += qty;
      return `<tr><td>${escapeHtml(upper(it.name))}</td><td>${escapeHtml(fornecedor)}</td><td class="r">${qty}</td><td class="r">☐</td></tr>`;

      <table><colgroup><col style="width:52%"><col style="width:26%"><col style="width:12%"><col style="width:10%"></colgroup>
      <thead><tr><th>Nome</th><th>Fornecedor</th><th class="r">Quantidade</th><th class="r">Conf.</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }).join('');

  return `
    <div class="production-alert">
      <div class="production-alert-title">ORDEM DE SERVIÇO</div>
      <div class="production-alert-sub">DOCUMENTO INTERNO — USO DA PRODUÇÃO E ENTREGA (sem valores)</div>
    </div>

    <div class="pdf-head">
      <div class="pdf-head-left">${logoImg}<div><h1>${escapeHtml(empresa)}</h1>${cfg.telefone?`<div style="font-size:8px;color:#666;">${escapeHtml(cfg.telefone)}</div>`:''}</div></div>
      ${cfg.email?`<div class="pdf-email">${escapeHtml(cfg.email)}</div>`:''}
    </div>
    ${cfg.endereco?`<div class="pdf-addr">${escapeHtml(upper(cfg.endereco))}${cfg.cidade?' · '+escapeHtml(cfg.cidade):''}</div>`:''}

    <div class="pdf-title-bar production-title-bar">ORDEM DE SERVIÇO ${pedido.numero?`Nº ${escapeHtml(pedido.numero)}`:''}</div>

    <div class="pdf-client-box production-info-box">
      <div class="production-info-title">DADOS DO PEDIDO</div>
      <div><b>Pedido:</b> ${escapeHtml(pedido.numero||'—')} &nbsp; · &nbsp; <b>Data:</b> ${dataHoje}</div>
      <div style="margin-top:2px;"><b>Cliente:</b> ${escapeHtml(upper(pedido.clientName||'—'))}${telefone?' &nbsp; · &nbsp; '+escapeHtml(telefone):''}</div>
      <div style="margin-top:2px;"><b>Vendedor:</b> ${escapeHtml(pedido.vendedorNome||'—')} &nbsp; · &nbsp; <b>Prazo:</b> ${pedido.prazoDias||5} dias úteis a partir da conversão em pedido</div>
      <div style="margin-top:2px;"><b>Entrega:</b> ${escapeHtml(localEntrega||'endereço não informado')}</div>
    </div>

    <div class="production-items-title">ITENS PARA SEPARAR / PRODUZIR</div>
    ${secsHtml}

    <div class="pdf-total-highlight production-total-highlight">
      <div class="tot-line grand"><span>TOTAL DE ITENS</span><span>${totalItens}</span></div>
    </div>

    <div class="pdf-footer">${escapeHtml(empresa)}${cfg.email?' · '+escapeHtml(cfg.email):''}<br>Ordem de Serviço — Documento interno</div>
  `;
}

function pdfHtmlFor(clienteNome, clienteTel, tabelaLabel, sections, subtotal, pctRaw, descontoVal, cardOn, cardVal, notaOn, notaVal, total, installLabel, numero, vendedorNome){

  const clienteEndereco = enderecoCompletoCliente(cliente); const clienteDoc = cliente && cliente.doc ? cliente.doc : '';
  const secsHtml = sections.map(sec=>{
    const pct = sectionPct(sec, pctRaw);
    const modoTag = pctRaw>0 ? (pct>0?' (A PRAZO)':' (À VISTA)') : '';
    const rows = sec.items.map(it=>{
      const qty=parseNum(it.qty), price=parseNum(it.price)*(1+pct/100), line=qty*price;
      return `<tr><td>${escapeHtml(upper(it.name))}</td><td class="r">${qty}</td><td class="r">R$ ${money(price)}</td><td class="r">R$ ${money(line)}</td></tr>`;

      <div class="subtot">Subtotal ${escapeHtml(upper(sec.title))}: R$ ${money(secSub)}</div>`;

  const logoImg = state.logoDataUrl ? `<img ${'s'+'rc'}="${state.logoDataUrl}">` : '';

  return `

      ${cfg.email?`<div class="pdf-email">${escapeHtml(cfg.email)}</div>`:''}
    </div>
    ${cfg.endereco?`<div class="pdf-addr">${escapeHtml(upper(cfg.endereco))}${cfg.cidade?' · '+escapeHtml(cfg.cidade):''}</div>`:''}
    <div class="pdf-sub">${numero?`<b>Orçamento Nº ${escapeHtml(numero)}</b> · `:''}${new Date().toLocaleDateString('pt-BR')}${vendedorNome?' · Vendedor: '+escapeHtml(vendedorNome):''}</div>

    <div class="pdf-title-bar">ORÇAMENTO ${numero?'Nº '+escapeHtml(numero):''}</div>

    <div class="pdf-client-box">
      <div style="font-weight:800; font-size:9.5px; margin-bottom:3px;">DADOS DO CLIENTE</div>
      <div><b>${escapeHtml(upper(clienteNome))}</b>${clienteTel?' · '+escapeHtml(clienteTel):''}</div>
      ${clienteDoc?`<div style="color:#666; margin-top:2px;">${escapeHtml(clienteDoc)}</div>`:''}
      ${clienteEndereco?`<div style="color:#666; margin-top:2px;">${escapeHtml(clienteEndereco)}</div>`:''}
    </div>

    <div style="font-size:8.5px; color:#555; margin-bottom:5px;">
      <b>Tabela de preço:</b> ${escapeHtml(tabelaLabel)}

    ${secsHtml}

    <div class="tot-block">
      <div class="tot-line"><span>Subtotal</span><span>R$ ${money(subtotal)}</span></div>
      ${descontoVal>0?`<div class="tot-line"><span>Desconto</span><span>- R$ ${money(descontoVal)}</span></div>`:''}
      ${cardOn?`<div class="tot-line"><span>Taxa do cartão</span><span>R$ ${money(cardVal)}</span></div>`:''}

/* ---------------- geração de PDF (desenho direto com jsPDF, sem "fotografar" a tela) ---------------- */
async function gerarPdfBlob(clienteNome, clienteTel, tabelaLabel, sections, subtotal, pctRaw, descontoVal, cardOn, cardVal, notaOn, notaVal, total, installLabel, numero, vendedorNome){
  await librariesReady;
  pctRaw = pctRaw||0;
  const cfg = state.config;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const marginX=12, pageWidth=210, pageHeight=297, rightX=pageWidth-marginX;
  const teal=[15,97,121], light=[220,229,232], greenBg=[229,242,230], greenBorder=[159,198,163];
  let y=14;

  function footer(){
    doc.setDrawColor(220,220,220); doc.setLineWidth(0.2);
    doc.line(marginX,286,rightX,286);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(110,110,110);
    const left=(cfg.empresa||'ORÇAMENTO').toUpperCase();
    doc.text(left,marginX,291);
    doc.text('Documento gerado pelo sistema de orçamentos',pageWidth/2,291,{align:'center'});
    doc.text(String(doc.getNumberOfPages()),rightX,291,{align:'right'});
  }
  function topHeader(first=false){
    if(!first){
      y=15;
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(70,70,70);
      doc.text((cfg.empresa||'ORÇAMENTO').toUpperCase(),marginX,y);
      doc.setTextColor(...teal); doc.text(numero?`ORÇAMENTO Nº ${numero}`:'ORÇAMENTO',rightX,y,{align:'right'});
      y+=6;
    }
  }
  function newPage(){
    footer();
    doc.addPage();
    topHeader(false);
  }
  function ensureSpace(h){
    if(y+h>278) newPage();
  }
  function roundedBox(x,yy,w,h,fill,border=null,r=3){
    doc.setFillColor(...fill);
    if(border){ doc.setDrawColor(...border); doc.setLineWidth(0.25); }
    doc.roundedRect(x,yy,w,h,r,r,'F');
    if(border) doc.roundedRect(x,yy,w,h,r,r,'S');
  }
  function textWrapped(text,x,yy,maxW,size=9,weight='normal'){
    doc.setFont('helvetica',weight); doc.setFontSize(size); doc.setTextColor(43,42,40);
    const lines=doc.splitTextToSize(String(text),maxW);
    doc.text(lines,x,yy);
    return lines.length*4.1;
  }

  // Cabeçalho
  const hasLogo=!!state.logoDataUrl;
  if(hasLogo){ try{ doc.addImage(state.logoDataUrl,'PNG',marginX,y-2,20,20); }catch(e){} }
  const textX=hasLogo?marginX+25:marginX;
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(15,60,82);
  doc.text((cfg.empresa||'ORÇAMENTO').toUpperCase(),textX,y+5);
  if(cfg.email){ doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(80,80,80); doc.text(cfg.email,rightX,y+2,{align:'right'}); }
  y+=10;
  if(cfg.endereco){
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(85,85,85);
    doc.text((cfg.endereco||'').toUpperCase(),textX,y);
    if(cfg.cidade) doc.text(cfg.cidade,rightX,y,{align:'right'});
    y+=4.5;
  }
  if(cfg.telefone||vendedorNome){
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(105,105,105);
    const info=[cfg.telefone, vendedorNome?('Vendedor: '+vendedorNome):''].filter(Boolean).join(' · ');
    doc.text(info,textX,y);
    y+=4.5;
  }
  y+=2;

  // Dados do cliente
  const cliente=state.clients.find(c=>normSearch(c.name)===normSearch(clienteNome));
  const clienteEndereco=enderecoCompletoCliente(cliente);
  const clienteDoc=cliente&&cliente.doc?cliente.doc:'';
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  const addrLines=clienteEndereco?doc.splitTextToSize(clienteEndereco,rightX-marginX-10).slice(0,2):[];
  const boxH=15+(clienteDoc?4.5:0)+addrLines.length*4.2;
  roundedBox(marginX,y,rightX-marginX,boxH,[238,241,242],[215,220,222],3);
  doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(45,45,45);
  doc.text('DADOS DO CLIENTE',marginX+5,y+5);
  doc.setFontSize(10.5); doc.text((clienteNome||'').toUpperCase(),marginX+5,y+10.5);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(60,60,60);
  if(clienteTel) doc.text(clienteTel,rightX-5,y+10.5,{align:'right'});
  let cy=y+15.5;
  if(clienteDoc){ doc.text(clienteDoc,marginX+5,cy); cy+=4.5; }
  if(addrLines.length){ doc.setTextColor(90,90,90); doc.text(addrLines,marginX+5,cy); }
  y+=boxH+5;

  // Título do documento
  roundedBox(marginX,y,rightX-marginX,10,teal);
  doc.setFont('helvetica','bold'); doc.setFontSize(14); doc.setTextColor(255,255,255);
  doc.text(`ORÇAMENTO ${numero?'Nº '+numero:''}`,pageWidth/2,y+6.7,{align:'center'});
  y+=15;

  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(75,75,75);
  doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`,marginX,y);
  doc.text(`Tabela: ${tabelaLabel}`,rightX,y,{align:'right'});
  y+=6;
  if(installLabel){
    doc.text(`Condição de pagamento: ${installLabel}`,marginX,y);
    y+=5;
  }

  // Seções
  sections.forEach(sec=>{
    const pct=sectionPct(sec,pctRaw);
    const modoTag=pctRaw>0?(pct>0?' (A PRAZO)':' (À VISTA)'):'';
    const title=upper(sec.title)+modoTag;
    ensureSpace(20);
    roundedBox(marginX,y,rightX-marginX,7,light);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(43,43,43);
    doc.text(title,marginX+4,y+4.8);
    y+=8;

    // Cabeçalho da tabela
    doc.setFillColor(244,244,244); doc.rect(marginX,y,rightX-marginX,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(7.3); doc.setTextColor(90,90,90);
    doc.text('NOME',marginX+2,y+4.1);
    doc.text('QUANTIDADE',marginX+104,y+4.1,{align:'right'});
    doc.text('VALOR UNITÁRIO',marginX+142,y+4.1,{align:'right'});
    doc.text('VALOR TOTAL',rightX-2,y+4.1,{align:'right'});
    y+=7;

    let secSub=0;
    sec.items.forEach(it=>{
      const qty=parseNum(it.qty), price=parseNum(it.price)*(1+pct/100), line=qty*price; secSub+=line;
      const lines=doc.splitTextToSize(upper(it.name),88);
      const rowH=Math.max(5,lines.length*4.1);
      ensureSpace(rowH+4);
      doc.setFont('helvetica','normal'); doc.setFontSize(8.6); doc.setTextColor(43,42,40);
      doc.text(lines,marginX+2,y);
      doc.text(String(qty),marginX+104,y,{align:'right'});
      doc.text('R$ '+money(price),marginX+142,y,{align:'right'});
      doc.text('R$ '+money(line),rightX-2,y,{align:'right'});
      doc.setDrawColor(225,225,225); doc.setLineWidth(0.2); doc.line(marginX,y+rowH-1,rightX,y+rowH-1);
      y+=rowH;
    });
    doc.setFont('helvetica','bold'); doc.setFontSize(8.3); doc.setTextColor(65,65,65);
    doc.text('Subtotal '+upper(sec.title),rightX,y+2,{align:'right'});
    doc.text('R$ '+money(secSub),rightX,y+6,{align:'right'});
    y+=10;
  });

  // Totais
  ensureSpace(45);
  doc.setDrawColor(190,190,190); doc.setLineWidth(0.35); doc.line(marginX,y,rightX,y); y+=7;
  function totalLine(label,value,big=false){
    doc.setFont('helvetica',big?'bold':'normal'); doc.setFontSize(big?13:9.5); doc.setTextColor(43,42,40);
    doc.text(label,marginX,y); doc.text(value,rightX,y,{align:'right'}); y+=big?7:5.5;
  }

/* Imprime um PDF (blob) direto pela janela de impressão do navegador; se não der, abre o PDF em outra aba. */
function imprimirBlob(blob){
  const url = URL.createObjectURL(blob);
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  let feito = false;
  iframe.onload = ()=>{
    if(feito) return; feito = true;
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }
    catch(e){ window.open(url, '_blank'); }
  };
  iframe.src = url;
  document.body.appendChild(iframe);
  setTimeout(()=>{ try{ iframe.remove(); URL.revokeObjectURL(url); }catch(e){} }, 120000);
}

async function gerarPDF(){
  const b = state.budget; const cfg = state.config;
  let clienteNome="", clienteTel="";
  if(b.clientId==='avulso'){ clienteNome=b.clientAvulsoNome; clienteTel=b.clientAvulsoTel; }
  else if(b.clientId){ const c = state.clients.find(c=>c.id===b.clientId); if(c){ clienteNome=c.name; clienteTel=c.phone; } }
  if(!clienteNome){ toast('Selecione ou digite um cliente antes de gerar o PDF'); return; }
  const hasItems = b.sections.some(s=>s.items.length>0);
  if(!hasItems){ toast('Adicione ao menos um item ao orçamento'); return; }
  if(!validarVendedor(b)) return;

  const t = calcTotals(b);
  const inst = cfg.installments[b.installIdx];
  const installLabel = inst ? `${inst.vezes}x` : '';

  // salva/atualiza como pedido (status orçamento, a menos que já esteja mais avançado) — feito antes pra já ter o número
  const pedido = await buildPedidoFromBudget(b.editingId); if(!pedido) return;
  if(b.editingId){ const idx = state.pedidos.findIndex(p=>p.id===b.editingId); if(idx>-1) state.pedidos[idx]=pedido; else state.pedidos.push(pedido); }
  else state.pedidos.push(pedido);
  savePedidos();

  const htmlContent = pdfHtmlFor(clienteNome, clienteTel, cfg.priceLabels[b.priceIdx], b.sections, t.subtotal, t.parcelPercentRaw, t.desconto, b.cardFee.on, t.card, b.notaFee.on, t.nota, t.total, installLabel, pedido.numero, pedido.vendedorNome);
  const pdfArgs = [clienteNome, clienteTel, cfg.priceLabels[b.priceIdx], b.sections, t.subtotal, t.parcelPercentRaw, t.desconto, b.cardFee.on, t.card, b.notaFee.on, t.nota, t.total, installLabel, pedido.numero, pedido.vendedorNome];

  gerarEMostrarPdf(clienteNome, clienteTel, htmlContent, pdfArgs);
  state.budget = newBudget();
}

function gerarPDFdePedido(p){
  const cfg = state.config;
  const inst = cfg.installments[p.installIdx];
  const pctRaw = p.parcelPercentRaw||0;
  const installLabel = inst ? `${inst.vezes}x` : '';
  const t = { subtotal:p.subtotal, desconto:0, card:0, nota:0, total:p.total };
  const base = p.subtotal;
  if(p.discount && p.discount.on){
    const val = parseNum(p.discount.value);
    if(p.discount.type==='%') t.desconto = base*val/100;
    else if(p.discount.type==='fixo') t.desconto = val;
    else if(p.discount.type==='final') t.desconto = base-val;
    if(t.desconto<0) t.desconto=0; if(t.desconto>base) t.desconto=base;
  }
  const baseComDesconto = base - t.desconto;
  if(p.cardFee && p.cardFee.on) t.card = p.cardFee.type==='%' ? baseComDesconto*parseNum(p.cardFee.value)/100 : parseNum(p.cardFee.value);
  if(p.notaFee && p.notaFee.on) t.nota = p.notaFee.type==='%' ? baseComDesconto*parseNum(p.notaFee.value)/100 : parseNum(p.notaFee.value);
  const htmlContent = pdfHtmlFor(p.clientName, p.clientPhone, cfg.priceLabels[p.priceIdx]||'', p.sections, p.subtotal, pctRaw, t.desconto, p.cardFee&&p.cardFee.on, t.card, p.notaFee&&p.notaFee.on, t.nota, p.total, installLabel, p.numero, p.vendedorNome);
  const pdfArgs = [p.clientName, p.clientPhone, cfg.priceLabels[p.priceIdx]||'', p.sections, p.subtotal, pctRaw, t.desconto, p.cardFee&&p.cardFee.on, t.card, p.notaFee&&p.notaFee.on, t.nota, p.total, installLabel, p.numero, p.vendedorNome];
  gerarEMostrarPdf(p.clientName||'pedido', p.clientPhone, htmlContent, pdfArgs);
}

function baixarArquivoTexto(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 1500);
}

async function importarBackupJSON(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data!=='object') throw new Error('formato inválido');
      if(data.config) state.config = Object.assign(state.config, data.config);
      if(Array.isArray(data.products)) state.products = data.products;
      if(Array.isArray(data.clients)) state.clients = data.clients;
      if(Array.isArray(data.pedidos)) state.pedidos = data.pedidos;
      if(Array.isArray(data.templates)) state.templates = data.templates;
      await Promise.all([saveConfig(), saveProducts(), saveClients(), savePedidos(), saveTemplates()]);
      toast('Backup restaurado com sucesso!');
      checkBackupGate(); checkLock(); render();
    }catch(e){ toast('Arquivo inválido — confira se é um backup gerado por este programa'); }
  };
  reader.onerror = ()=> toast('Não consegui ler esse arquivo');
  reader.readAsText(file);
}

    _authListenerStarted=true;
    window.fbOnAuth(window.fbAuth, async user=>{
      if(!user){
        window._firebaseReady=false; state.unlocked=false; checkLock();
        const btn=document.getElementById('lockBtn');
        if(btn){btn.disabled=false;btn.textContent='Entrar';}
        return;
      }
      // Login confirmado: libera a tela imediatamente. O Firestore não pode bloquear o login.
      window._firebaseReady=true;
      state.unlocked=true;
      checkLock();
      render();
      const btn=document.getElementById('lockBtn');
      if(btn){btn.disabled=false;btn.textContent='Entrar';}
      try{
        if(!_loadAllPromise) _loadAllPromise=loadAll();
        await _loadAllPromise;
      }catch(e){
        console.error('Erro ao carregar dados:',e);
        toast('Login realizado, mas alguns dados não puderam ser carregados.');
      }finally{
        _loadAllPromise=null;
      }
    });
  }catch(e){
    console.error('Firebase:',e);
    const el=document.getElementById('lockError');
    if(el) el.textContent='Não foi possível inicializar o Firebase: '+(e.message||e);
    const btn=document.getElementById('lockBtn');
    if(btn){btn.disabled=false;btn.textContent='Entrar';}
    checkLock();
  }
}

document.getElementById('refreshBtn').addEventListener('click',()=>refreshData(false));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && state.unlocked && window._firebaseReady && Date.now()-_lastRefresh>120000) refreshData(true); });
// O módulo Firebase é carregado de forma assíncrona. Esperamos por ele explicitamente.
initFirebaseAndAuth();
// Segurança: nunca deixe o botão preso em estado de carregamento.
setTimeout(()=>{
  const btn=document.getElementById('lockBtn');
  if(btn && !window._firebaseReady && btn.disabled){ btn.disabled=false; btn.textContent='Entrar'; }
},15000);

/* ---------------- PWA: registra o service worker (deixa o app instalável) ---------------- */
/* ---------------- botão "voltar" do Android: nunca sai do app ---------------- */
(function(){
  let _trapSeq = 0;
  function armTrap(){ try{ history.pushState({appTrap:true}, '', '#_t'+(++_trapSeq)); }catch(e){} }
  function handleBack(){
    const modalRoot = document.getElementById('modalRoot');
    if(modalRoot && modalRoot.innerHTML.trim() !== ''){
      modalRoot.innerHTML = '';
      return;
    }
    if(state.pedidoAberto){
      state.pedidoAberto = null; render();
      return;
    }
    if(state.tab !== 'inicio'){
      state.tab = 'inicio';
      document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x.dataset.tab==='inicio'));
      render();
      return;
    }
    // já na Início, sem nada aberto: não sai, só mantém o app
  }

  armTrap();
  armTrap(); // duas entradas de "colchão", por segurança

  if('navigation' in window){
    // API mais nova: intercepta a navegação antes dela se concretizar
    navigation.addEventListener('navigate', function(event){
      if(event.navigationType === 'traverse'){
        event.intercept({ handler: function(){ handleBack(); armTrap(); } });
      }
    });
  } else {
    // reserva para navegadores sem suporte à Navigation API
    window.addEventListener('popstate', function(){ handleBack(); armTrap(); });
  }
})();


if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Falha ao registrar service worker:', e));
  });
}
</script>
